# Default values for the aether-vault chart.
# See README.md in this directory for the honest verification status: this chart is
# `helm template | kubeconform -strict` schema-verified in CI (helm-lint job), NOT
# drilled against a real running cluster on this machine — see docker-compose.ha.yml /
# scripts/ha_drill.sh for the topology that IS genuinely drilled locally.

replicaCount: 2

image:
  # tests/test_helm_chart.py pins this against release.yml so it can't drift.
  repository: ghcr.io/leon1706-lol/aether-vault-engine
  tag: "1.3.2"
  pullPolicy: IfNotPresent

engine:
  role: all
  port: 8000
  webuiPort: 3000
  # Matches AV_ENGINE_STOP_GRACE_SECS' default (engine-entrypoint.sh drains up to 25s
  # before SIGKILL), mirrored here so the chart and the compose files agree.
  stopGraceSecs: 25
  terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  apiPort: 8000
  webuiPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aether-vault.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Database/Redis connection strings — left empty by default (must be supplied via
# --set or existingSecret below). This chart does not deploy Postgres/Redis itself —
# bring your own managed instance or a separate chart (e.g. bitnami/postgresql).
database:
  # If existingSecret is set, url/appUrl are ignored and the secret's own keys
  # (databaseUrl / appDatabaseUrl) are used instead.
  url: ""
  # Optional non-superuser role connection string for request-serving sessions -- see
  # database.py's AV_APP_DATABASE_URL docstring. Leave empty to fall back to `url`.
  appUrl: ""
  existingSecret: ""

redis:
  url: ""
  existingSecret: ""

auth:
  # AV_API_TOKEN / AV_AUTH_USERS — left empty (Anonymous mode) by default. Set via
  # --set or an existingSecret in production.
  apiToken: ""
  authUsers: ""
  existingSecret: ""

tenancy:
  enforce: false

rateLimit:
  backend: memory   # "redis" recommended once replicaCount > 1
  default: ""
  gc: "10/minute"

authSpike:
  backend: memory

migrationJob:
  enabled: true
  # Runs as a Helm pre-upgrade/pre-install hook Job, so schema is at head before any
  # replica of the new Deployment starts serving traffic.
  backoffLimit: 3

nodeSelector: {}
tolerations: []
affinity: {}
