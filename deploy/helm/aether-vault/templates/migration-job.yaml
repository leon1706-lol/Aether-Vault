{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aether-vault.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "aether-vault.labels" . | nindent 4 }}
  annotations:
    # Runs before the upgraded Deployment's new pods start (weight -5) so schema is at
    # head before any replica serves traffic. hook-succeeded keeps completed Jobs from
    # piling up; before-hook-creation cleans up a job stuck from a failed prior attempt.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "aether-vault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Runs the same init_db() entry point the app's own startup lifespan calls.
          # Deliberately does not set AV_APP_DATABASE_URL: migrations always need the
          # DDL-capable role (DATABASE_URL).
          command:
            - python
            - -c
            - "import asyncio; from av_server.database import init_db; asyncio.run(init_db())"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "aether-vault.secretName" . }}
                  key: databaseUrl
{{- end }}
