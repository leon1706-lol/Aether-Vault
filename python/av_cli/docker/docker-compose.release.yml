# Runtime compose file for `pip install aether-vault` end users — pulls the published
# ENGINE image from GHCR instead of building from local source. Shipped as package data
# inside the wheel; used by `docker_runtime.resolve_compose_file()` whenever no source
# checkout is found (i.e. always, for a real pip install). Contributors running from an
# editable/source install keep using the repo-root `docker-compose.yml` (build:-based)
# instead — this file is never used there.
#
# v1.2.2 engine topology: ONE image (ghcr.io/leon1706-lol/aether-vault-engine), ONE
# container running all subservices (registry :8000 + webui :3000). The legacy
# aether-vault-server/-webui images remain published as aliases of this same image for
# one transition cycle; they are scheduled for removal in the NEXT release.
#
# Keep the image names/tags here in sync with `.github/workflows/release.yml` and
# `.github/workflows/docker-edge.yml`, which publish exactly these images.
services:
  aether-vault-engine:
    image: ghcr.io/leon1706-lol/aether-vault-engine:latest
    container_name: aether-vault-engine
    ports:
      - '8000:8000'
      - '3000:3000'
    volumes:
      - vault_data:/data
    environment:
      - AV_DATA_DIR=/data
      # Explicit role: with DATABASE_URL also set here, the entrypoint's legacy
      # auto-detect would pick "server"-only — pin "all" for one-container mode.
      - AV_ENGINE_ROLE=all
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
      - WEBUI_PORT=3000
      - DATABASE_URL=postgresql+asyncpg://av_user:av_password@db:5432/aether_vault
      - REDIS_URL=redis://redis:6379/0
      # Optional shared-secret gate ("Protected" mode) — empty/unset means every route behaves
      # exactly as before ("Anonymous"). Set via `av auth set-token`, which writes this to a
      # .env file next to this compose file and restarts this service to pick it up.
      - AV_API_TOKEN=${AV_API_TOKEN:-}
      # Optional per-user token map ({"username": "token", ...} JSON) managed by
      # `av auth add-user/list-users/remove-user` via the same .env + restart plumbing.
      - AV_AUTH_USERS=${AV_AUTH_USERS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # v1.2.5: matches AV_ENGINE_STOP_GRACE_SECS' default (engine-entrypoint.sh drains for
    # up to 25s before SIGKILL) — Docker's own default stop-timeout (10s) would SIGKILL
    # before that drain window finishes.
    stop_grace_period: 30s
    # Both runtimes exist in-engine (python + node): python-urllib checks :8000,
    # node fetch checks :3000. No extra packages added for healthchecking. The server leg
    # checks /api/ready (v1.2.5), not /api/health — health is liveness-only (DB-free,
    # stays green even with an unwritable AV_DATA_DIR); ready also checks DB/Redis/data-dir
    # writability, which is what "is this container actually usable" should mean here.
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/ready\").read()" && node -e "fetch(\"http://localhost:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 40s

  # Postgres/Redis are intentionally NOT port-mapped to the host here (unlike the dev
  # docker-compose.yml, where contributors' tests/test_server.py need direct localhost
  # access). Real end users have no need to reach these directly — the server reaches them by
  # service name over the Docker-internal network regardless — and the credentials below are
  # public (committed source), so leaving these ports open on a host reachable by others would
  # hand out full DB/cache access to anyone who can reach it. Use `docker exec -it
  # aether-vault-db psql -U av_user -d aether_vault` to inspect data directly if needed.
  db:
    image: postgres:15-alpine
    container_name: aether-vault-db
    environment:
      POSTGRES_USER: av_user
      POSTGRES_PASSWORD: av_password
      POSTGRES_DB: aether_vault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_user -d aether_vault"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: aether-vault-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vault_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
