# Runtime compose file for `pip install aether-vault` end users — pulls published images from
# GHCR instead of building from local source. Shipped as package data inside the wheel; used by
# `docker_runtime.resolve_compose_file()` whenever no source checkout is found (i.e. always, for
# a real pip install). Contributors running from an editable/source install keep using the
# repo-root `docker-compose.yml` (build:-based) instead — this file is never used there.
#
# Keep the image names/tags here in sync with `.github/workflows/release.yml` and
# `.github/workflows/docker-edge.yml`, which publish exactly these images.
services:
  aether-vault-server:
    image: ghcr.io/leon1706/aether-vault-server:latest
    container_name: aether-vault-server
    ports:
      - '8000:8000'
    volumes:
      - vault_data:/data
    environment:
      - AV_DATA_DIR=/data
      - DATABASE_URL=postgresql+asyncpg://av_user:av_password@db:5432/aether_vault
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health").read()']
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 40s

  aether-vault-webui:
    image: ghcr.io/leon1706/aether-vault-webui:latest
    container_name: aether-vault-webui
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      aether-vault-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: aether-vault-db
    environment:
      POSTGRES_USER: av_user
      POSTGRES_PASSWORD: av_password
      POSTGRES_DB: aether_vault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_user -d aether_vault"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: aether-vault-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vault_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
