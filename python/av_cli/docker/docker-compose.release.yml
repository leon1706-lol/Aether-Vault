# Runtime compose file for `pip install aether-vault` end users — pulls published images from
# GHCR instead of building from local source. Shipped as package data inside the wheel; used by
# `docker_runtime.resolve_compose_file()` whenever no source checkout is found (i.e. always, for
# a real pip install). Contributors running from an editable/source install keep using the
# repo-root `docker-compose.yml` (build:-based) instead — this file is never used there.
#
# Keep the image names/tags here in sync with `.github/workflows/release.yml` and
# `.github/workflows/docker-edge.yml`, which publish exactly these images.
services:
  aether-vault-server:
    image: ghcr.io/leon1706-lol/aether-vault-server:latest
    container_name: aether-vault-server
    ports:
      - '8000:8000'
    volumes:
      - vault_data:/data
    environment:
      - AV_DATA_DIR=/data
      - DATABASE_URL=postgresql+asyncpg://av_user:av_password@db:5432/aether_vault
      - REDIS_URL=redis://redis:6379/0
      # Optional shared-secret gate ("Protected" mode) — empty/unset means every route behaves
      # exactly as before ("Anonymous"). Set via `av auth set-token`, which writes this to a
      # .env file next to this compose file and restarts this service to pick it up.
      - AV_API_TOKEN=${AV_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health").read()']
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 40s

  aether-vault-webui:
    image: ghcr.io/leon1706-lol/aether-vault-webui:latest
    container_name: aether-vault-webui
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      aether-vault-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # Postgres/Redis are intentionally NOT port-mapped to the host here (unlike the dev
  # docker-compose.yml, where contributors' tests/test_server.py need direct localhost
  # access). Real end users have no need to reach these directly — the server reaches them by
  # service name over the Docker-internal network regardless — and the credentials below are
  # public (committed source), so leaving these ports open on a host reachable by others would
  # hand out full DB/cache access to anyone who can reach it. Use `docker exec -it
  # aether-vault-db psql -U av_user -d aether_vault` to inspect data directly if needed.
  db:
    image: postgres:15-alpine
    container_name: aether-vault-db
    environment:
      POSTGRES_USER: av_user
      POSTGRES_PASSWORD: av_password
      POSTGRES_DB: aether_vault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_user -d aether_vault"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: aether-vault-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vault_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
