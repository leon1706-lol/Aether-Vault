# Runtime compose file for `pip install aether-vault` end users — pulls the published
# ENGINE image from GHCR instead of building from local source. Shipped as package data
# inside the wheel; used by `docker_runtime.resolve_compose_file()` whenever no source
# checkout is found (i.e. always, for a real pip install). Contributors running from an
# editable/source install keep using the repo-root `docker-compose.yml` (build:-based)
# instead — this file is never used there.
#
# v1.2.2 engine topology: ONE image (ghcr.io/leon1706-lol/aether-vault-engine), ONE
# container running all subservices (registry :8000 + webui :3000). The legacy
# aether-vault-server/-webui images remain published as aliases of this same image for
# one transition cycle; they are scheduled for removal in the NEXT release.
#
# Keep the image names/tags here in sync with `.github/workflows/release.yml` and
# `.github/workflows/docker-edge.yml`, which publish exactly these images.
#
# Every memory knob is `${VAR:-default}` interpolation (V1.6.3), never a second overlay
# file: `av auth set-token`/`av update` always run `docker compose -f <this file>` and
# would drop an overlay. Overrides go in the `.env` next to this file -- README's
# "Low-memory mode" has the block for a small machine.
services:
  aether-vault-engine:
    image: ghcr.io/leon1706-lol/aether-vault-engine:latest
    container_name: aether-vault-engine
    ports:
      - '8000:8000'
      - '3000:3000'
    volumes:
      - vault_data:/data
    environment:
      - AV_DATA_DIR=/data
      # Explicit role: with DATABASE_URL also set here, the entrypoint's legacy
      # auto-detect would pick "server"-only — pin "all" for one-container mode.
      # `AV_ENGINE_ROLE=server` in .env gives an API-only container (no Next.js process).
      - AV_ENGINE_ROLE=${AV_ENGINE_ROLE:-all}
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
      - WEBUI_PORT=3000
      - DATABASE_URL=postgresql+asyncpg://av_user:av_password@db:5432/aether_vault
      # v1.3.4 (W3a): this line was MISSING from the release compose (present in the dev
      # docker-compose.yml since v1.3.2) — every real `pip install aether-vault` user was
      # silently getting the RLS-bypassing superuser-only topology migration 0015 exists
      # specifically to close. See docker-compose.yml's identical variable for the full
      # av_user/av_app rationale; migration 0015 creates the `av_app` role itself (no
      # extra Postgres init step needed here) the first time the server boots.
      - AV_APP_DATABASE_URL=postgresql+asyncpg://av_app:av_app_password@db:5432/aether_vault
      - REDIS_URL=redis://redis:6379/0
      # Optional shared-secret gate ("Protected" mode) — empty/unset means every route behaves
      # exactly as before ("Anonymous"). Set via `av auth set-token`, which writes this to a
      # .env file next to this compose file and restarts this service to pick it up.
      - AV_API_TOKEN=${AV_API_TOKEN:-}
      # Optional per-user token map ({"username": "token", ...} JSON) managed by
      # `av auth add-user/list-users/remove-user` via the same .env + restart plumbing.
      - AV_AUTH_USERS=${AV_AUTH_USERS:-}
      # Footprint knobs (V1.6.3) -- see development/infrastructure.md for each.
      - AV_UVICORN_WORKERS=${AV_UVICORN_WORKERS:-1}
      - AV_UVICORN_LIMIT_CONCURRENCY=${AV_UVICORN_LIMIT_CONCURRENCY:-}
      - AV_WEBUI_NODE_HEAP_MB=${AV_WEBUI_NODE_HEAP_MB:-256}
      - AV_DB_POOL_SIZE=${AV_DB_POOL_SIZE:-10}
      - AV_DB_MAX_OVERFLOW=${AV_DB_MAX_OVERFLOW:-20}
      - AV_MAX_UPLOAD_BYTES=${AV_MAX_UPLOAD_BYTES:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # v1.2.5: matches AV_ENGINE_STOP_GRACE_SECS' default (engine-entrypoint.sh drains for
    # up to 25s before SIGKILL) — Docker's own default stop-timeout (10s) would SIGKILL
    # before that drain window finishes.
    stop_grace_period: 30s
    # Compose v2 honors deploy.resources.limits on plain `docker compose up`. A cap, not
    # a reservation -- see development/MEMORY.md for what the engine actually idles at.
    deploy:
      resources:
        limits:
          memory: ${AV_ENGINE_MEM_LIMIT:-768M}
    # Role-aware bash probe over /dev/tcp (baked into the image as /engine-healthcheck.sh):
    # no python or node process forked every tick. The server leg checks /api/ready
    # (v1.2.5), not /api/health — health is liveness-only (DB-free, stays green even with
    # an unwritable AV_DATA_DIR); ready also checks DB/Redis/data-dir writability, which
    # is what "is this container actually usable" should mean here.
    healthcheck:
      test: ["CMD", "/engine-healthcheck.sh"]
      interval: ${AV_HEALTHCHECK_INTERVAL:-30s}
      timeout: 10s
      retries: 5
      start_period: 40s

  # Postgres/Redis are intentionally NOT port-mapped to the host here (unlike the dev
  # docker-compose.yml, where contributors' tests/test_server.py need direct localhost
  # access). Real end users have no need to reach these directly — the server reaches them by
  # service name over the Docker-internal network regardless — and the credentials below are
  # public (committed source), so leaving these ports open on a host reachable by others would
  # hand out full DB/cache access to anyone who can reach it. Use `docker exec -it
  # aether-vault-db psql -U av_user -d aether_vault` to inspect data directly if needed.
  db:
    image: postgres:15-alpine
    container_name: aether-vault-db
    # Memory tunables (V1.6.3): the image default shared_buffers=128MB is sized for a
    # dedicated DB host; this registry's working set is small. max_connections stays at
    # Postgres' own 100 because ONE engine process opens two pools (10+20 each).
    command: >
      postgres
      -c shared_buffers=${AV_PG_SHARED_BUFFERS:-64MB}
      -c work_mem=${AV_PG_WORK_MEM:-4MB}
      -c maintenance_work_mem=${AV_PG_MAINT_WORK_MEM:-32MB}
      -c effective_cache_size=${AV_PG_EFFECTIVE_CACHE:-256MB}
      -c max_connections=${AV_PG_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_USER: av_user
      POSTGRES_PASSWORD: av_password
      POSTGRES_DB: aether_vault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${AV_DB_MEM_LIMIT:-256M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_user -d aether_vault"]
      interval: ${AV_HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: aether-vault-redis
    # redis-stack reads REDIS_ARGS (its entrypoint owns CMD). volatile-lru on purpose:
    # the Bloom filter key (av:hash_filter) has no TTL and must never be evicted; the
    # TTL'd device-code / SAML-replay / rate-limit keys are the ones safe to shed.
    environment:
      - REDIS_ARGS=--maxmemory ${AV_REDIS_MAXMEMORY:-128mb} --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: ${AV_REDIS_MEM_LIMIT:-192M}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${AV_HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vault_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
