# Least-connections load balancer for the HA topology (docker-compose.ha.yml).
#
# Honest limitation: this is nginx OSS, which has no active health-check module.
# `max_fails`/`fail_timeout` mark a backend down only after a real failed request hits
# it (passive, not active polling of /api/ready) — proven by scripts/ha_drill.sh's
# kill-one-replica step.
worker_processes auto;
events {
    worker_connections 1024;
}

http {
    upstream av_engines {
        least_conn;
        server engine-1:8000 max_fails=2 fail_timeout=10s;
        server engine-2:8000 max_fails=2 fail_timeout=10s;
    }

    upstream av_webui {
        least_conn;
        server engine-1:3000 max_fails=2 fail_timeout=10s;
        server engine-2:3000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8000;
        # Object uploads are multi-GB model shards: nginx's default 1m body cap returned
        # 413 for any real artifact through this LB (real bug, V1.6.3 -- the engine
        # itself has AV_MAX_UPLOAD_BYTES for an actual cap). Request buffering off so a
        # shard streams straight to the engine instead of being spooled to the LB's disk
        # first; proxy_next_upstream would replay a buffered body onto a second replica
        # anyway, which CAS makes idempotent but is wasted work at this size.
        client_max_body_size 0;
        proxy_request_buffering off;
        location / {
            proxy_pass http://av_engines;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 3000;
        location / {
            proxy_pass http://av_webui;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
