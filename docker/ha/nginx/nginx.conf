# Least-connections load balancer for the HA topology (docker-compose.ha.yml).
#
# **Honest limitation, stated plainly:** this is nginx OSS, not nginx-plus -- OSS has no
# active health-check module. "health-checked against /api/ready" is real but PASSIVE:
# `max_fails`/`fail_timeout` mark a backend down after real failed requests hit it, and
# `proxy_next_upstream` retries the request against the other replica in the same client
# request rather than surfacing the failure. Combined with each engine's own Docker
# HEALTHCHECK (docker-compose.ha.yml) and `depends_on: condition: service_healthy`, a
# replica that's actually down never receives fresh connections once one request has
# failed against it -- which is what scripts/ha_drill.sh's kill-one-replica step proves,
# not a claim about nginx doing active out-of-band polling of /api/ready itself.
worker_processes auto;
events {
    worker_connections 1024;
}

http {
    upstream av_engines {
        least_conn;
        server engine-1:8000 max_fails=2 fail_timeout=10s;
        server engine-2:8000 max_fails=2 fail_timeout=10s;
    }

    upstream av_webui {
        least_conn;
        server engine-1:3000 max_fails=2 fail_timeout=10s;
        server engine-2:3000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8000;
        location / {
            proxy_pass http://av_engines;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 3000;
        location / {
            proxy_pass http://av_webui;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
