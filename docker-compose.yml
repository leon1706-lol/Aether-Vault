# ============================================================================
# Dev compose: ONE image, ONE container running ALL subservices — FastAPI registry on
# :8000 AND the Next.js webui on :3000, supervised by docker/engine-entrypoint.sh.
#
# The release twin at python/av_cli/docker/docker-compose.release.yml mirrors this
# shape but pulls published GHCR images and doesn't map 5432/6379 to the host (this dev
# file does, so tests/test_server.py can reach Postgres/Redis directly from localhost).
# ============================================================================
services:
  aether-vault-engine:
    build:
      context: .
      # Explicit — the Dockerfile has server/webui targets appended after this one, so
      # relying on "the last stage in the file" as the implicit default isn't safe.
      target: engine
    container_name: aether-vault-engine
    ports:
      - '8000:8000'
      - '3000:3000'
    volumes:
      - vault_data:/data
    environment:
      - AV_DATA_DIR=/data
      # Explicit role: with DATABASE_URL also set here, the legacy auto-detect
      # would otherwise pick "server"-only — pin "all" for the one-container mode.
      - AV_ENGINE_ROLE=all
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
      - WEBUI_PORT=3000
      - DATABASE_URL=postgresql+asyncpg://av_user:av_password@db:5432/aether_vault
      # Closes the RLS-superuser gap: av_user is a Postgres superuser (the postgres
      # image grants that to whatever POSTGRES_USER names) and superusers bypass RLS.
      # av_app is an ordinary role migration 0015 creates with only
      # SELECT/INSERT/UPDATE/DELETE; request-serving sessions use it so RLS is a real
      # backstop here. Unset entirely to fall back to single-role behavior.
      - AV_APP_DATABASE_URL=postgresql+asyncpg://av_app:av_app_password@db:5432/aether_vault
      - REDIS_URL=redis://redis:6379/0
      # Optional shared-secret gate ("Protected" mode) — empty/unset means every route behaves
      # exactly as before ("Anonymous"). Set via `av auth set-token`, which writes this to a
      # .env file next to this compose file and restarts this service to pick it up.
      - AV_API_TOKEN=${AV_API_TOKEN:-}
      # Optional per-user token map ({"username": "token", ...} JSON) managed by
      # `av auth add-user/list-users/remove-user` via the same .env + restart plumbing.
      - AV_AUTH_USERS=${AV_AUTH_USERS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Matches AV_ENGINE_STOP_GRACE_SECS' default (drains up to 25s before SIGKILL);
    # Docker's own default stop-timeout is 10s, which would SIGKILL too early.
    stop_grace_period: 30s
    # Both runtimes exist in-engine, so both health legs are checked without adding any
    # package. The server leg checks /api/ready, not /api/health -- ready also checks
    # DB/Redis/data-dir writability, which is what "actually usable" should mean here.
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/ready\").read()" && node -e "fetch(\"http://localhost:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: aether-vault-db
    environment:
      POSTGRES_USER: av_user
      POSTGRES_PASSWORD: av_password
      POSTGRES_DB: aether_vault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_user -d aether_vault"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: aether-vault-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vault_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
