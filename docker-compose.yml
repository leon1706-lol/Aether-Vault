services:
  aether-vault-server:
    build: .
    container_name: aether-vault-server
    ports:
      - '8000:8000'
    volumes:
      - vault_data:/data
    environment:
      - AV_DATA_DIR=/data
      - DATABASE_URL=postgresql+asyncpg://av_user:av_password@db:5432/aether_vault
      - REDIS_URL=redis://redis:6379/0
      # Optional shared-secret gate ("Protected" mode) — empty/unset means every route behaves
      # exactly as before ("Anonymous"). Set via `av auth set-token`, which writes this to a
      # .env file next to this compose file and restarts this service to pick it up. Postgres/
      # Redis ports stay mapped to the host in *this* dev compose file specifically so
      # tests/test_server.py's direct localhost:5432/6379 connections keep working — see
      # docker-compose.release.yml (the one real end users run) for the hardened version of
      # this same stack, which removes those mappings.
      - AV_API_TOKEN=${AV_API_TOKEN:-}
      # Optional per-user token map ({"username": "token", ...} JSON) managed by
      # `av auth add-user/list-users/remove-user` via the same .env + restart plumbing.
      - AV_AUTH_USERS=${AV_AUTH_USERS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health").read()']
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 40s

  # ── Web UI Dashboard ──────────────────────────────────────────────────────
  aether-vault-webui:
    build:
      context: ./webui
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: aether-vault-webui
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      aether-vault-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: aether-vault-db
    environment:
      POSTGRES_USER: av_user
      POSTGRES_PASSWORD: av_password
      POSTGRES_DB: aether_vault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_user -d aether_vault"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: aether-vault-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vault_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
