# ============================================================================
# Dev compose: ONE image, ONE container running ALL subservices — FastAPI registry on
# :8000 AND the Next.js webui on :3000, supervised by docker/engine-entrypoint.sh.
#
# The release twin at python/av_cli/docker/docker-compose.release.yml mirrors this
# shape but pulls published GHCR images and doesn't map 5432/6379 to the host (this dev
# file does, so tests/test_server.py can reach Postgres/Redis directly from localhost).
#
# Every memory knob is `${VAR:-default}` interpolation (V1.6.3), never a second overlay
# file: `av auth set-token`/`av update` always run `docker compose -f <this file>` and
# would drop an overlay. Put overrides in the `.env` next to this file -- README's
# "Low-memory mode" has the block for a small machine.
# ============================================================================
services:
  aether-vault-engine:
    build:
      context: .
      # Explicit — the Dockerfile has server/webui targets appended after this one, so
      # relying on "the last stage in the file" as the implicit default isn't safe.
      target: engine
    container_name: aether-vault-engine
    ports:
      - '8000:8000'
      - '3000:3000'
    volumes:
      - vault_data:/data
    environment:
      - AV_DATA_DIR=/data
      # Explicit role: with DATABASE_URL also set here, the legacy auto-detect
      # would otherwise pick "server"-only — pin "all" for the one-container mode.
      # `AV_ENGINE_ROLE=server` in .env gives an API-only container (no Next.js process).
      - AV_ENGINE_ROLE=${AV_ENGINE_ROLE:-all}
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
      - WEBUI_PORT=3000
      - DATABASE_URL=postgresql+asyncpg://av_user:av_password@db:5432/aether_vault
      # Closes the RLS-superuser gap: av_user is a Postgres superuser (the postgres
      # image grants that to whatever POSTGRES_USER names) and superusers bypass RLS.
      # av_app is an ordinary role migration 0015 creates with only
      # SELECT/INSERT/UPDATE/DELETE; request-serving sessions use it so RLS is a real
      # backstop here. Unset entirely to fall back to single-role behavior.
      - AV_APP_DATABASE_URL=postgresql+asyncpg://av_app:av_app_password@db:5432/aether_vault
      - REDIS_URL=redis://redis:6379/0
      # Optional shared-secret gate ("Protected" mode) — empty/unset means every route behaves
      # exactly as before ("Anonymous"). Set via `av auth set-token`, which writes this to a
      # .env file next to this compose file and restarts this service to pick it up.
      - AV_API_TOKEN=${AV_API_TOKEN:-}
      # Optional per-user token map ({"username": "token", ...} JSON) managed by
      # `av auth add-user/list-users/remove-user` via the same .env + restart plumbing.
      - AV_AUTH_USERS=${AV_AUTH_USERS:-}
      # Footprint knobs (V1.6.3) -- see development/infrastructure.md for each.
      - AV_UVICORN_WORKERS=${AV_UVICORN_WORKERS:-1}
      - AV_UVICORN_LIMIT_CONCURRENCY=${AV_UVICORN_LIMIT_CONCURRENCY:-}
      - AV_WEBUI_NODE_HEAP_MB=${AV_WEBUI_NODE_HEAP_MB:-256}
      - AV_DB_POOL_SIZE=${AV_DB_POOL_SIZE:-10}
      - AV_DB_MAX_OVERFLOW=${AV_DB_MAX_OVERFLOW:-20}
      - AV_MAX_UPLOAD_BYTES=${AV_MAX_UPLOAD_BYTES:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Matches AV_ENGINE_STOP_GRACE_SECS' default (drains up to 25s before SIGKILL);
    # Docker's own default stop-timeout is 10s, which would SIGKILL too early.
    stop_grace_period: 30s
    # Compose v2 honors deploy.resources.limits on plain `docker compose up` (no swarm,
    # no --compatibility flag needed). A cap, not a reservation: the engine idles far
    # below it (see development/MEMORY.md), this is where a runaway gets stopped.
    deploy:
      resources:
        limits:
          memory: ${AV_ENGINE_MEM_LIMIT:-768M}
    # Role-aware bash probe over /dev/tcp (docker/engine-healthcheck.sh): no python or
    # node process forked every tick, unlike the previous CMD-SHELL. The server leg
    # checks /api/ready, not /api/health -- ready also checks DB/Redis/data-dir
    # writability, which is what "actually usable" should mean here.
    healthcheck:
      test: ["CMD", "/engine-healthcheck.sh"]
      interval: ${AV_HEALTHCHECK_INTERVAL:-30s}
      timeout: 10s
      retries: 5
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: aether-vault-db
    # Memory tunables (V1.6.3): the image default shared_buffers=128MB is sized for a
    # dedicated DB host; this registry's working set is small. max_connections stays at
    # Postgres' own 100 because ONE engine process opens two pools (10+20 each).
    command: >
      postgres
      -c shared_buffers=${AV_PG_SHARED_BUFFERS:-64MB}
      -c work_mem=${AV_PG_WORK_MEM:-4MB}
      -c maintenance_work_mem=${AV_PG_MAINT_WORK_MEM:-32MB}
      -c effective_cache_size=${AV_PG_EFFECTIVE_CACHE:-256MB}
      -c max_connections=${AV_PG_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_USER: av_user
      POSTGRES_PASSWORD: av_password
      POSTGRES_DB: aether_vault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    deploy:
      resources:
        limits:
          memory: ${AV_DB_MEM_LIMIT:-256M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_user -d aether_vault"]
      interval: ${AV_HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: aether-vault-redis
    # redis-stack reads REDIS_ARGS (its entrypoint owns CMD). volatile-lru on purpose:
    # the Bloom filter key (av:hash_filter, ~1.8 MB at 1M/0.1%) has no TTL and must
    # never be evicted -- every upload would silently fall back to a DB round trip until
    # the next GC rebuild; device-code / SAML-replay / rate-limit keys are TTL'd and are
    # exactly the ones safe to shed under pressure.
    environment:
      - REDIS_ARGS=--maxmemory ${AV_REDIS_MAXMEMORY:-128mb} --maxmemory-policy volatile-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: ${AV_REDIS_MEM_LIMIT:-192M}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${AV_HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  vault_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
