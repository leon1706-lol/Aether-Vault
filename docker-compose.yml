version: '3.8'
services:
  aether-vault-server:
    build: .
    container_name: aether-vault-server
    ports:
      - '8000:8000'
    volumes:
      - vault_data:/data
    environment:
      - AV_DATA_DIR=/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  vault_data:
    driver: local
