# ============================================================================
# HA topology -- a self-contained compose file, deliberately not layered as an override
# on top of docker-compose.yml since an HA topology changes so much service-by-service
# (host-port mapping, which database each engine talks to) that a partial override
# would be harder to read correctly than one self-contained file.
#
# Shape: nginx least-conn load balancer in front of 2 stateless engine replicas, a
# Postgres primary + real streaming-replication standby, and a Redis primary + replica.
# `scripts/ha_drill.sh` is the actual proof this is more than YAML.
#
# Run it:
#   docker compose -f docker-compose.ha.yml up -d --build
#   ./scripts/ha_drill.sh
#   docker compose -f docker-compose.ha.yml down -v
# ============================================================================
# Explicit project name -- keeps this topology's network/volumes/container namespace
# entirely separate from docker-compose.yml's default "aether-vault" project, so both
# can run side by side without a name collision.
name: aether-vault-ha

services:
  lb:
    image: nginx:1.27-alpine
    container_name: aether-vault-ha-lb
    ports:
      - '8000:8000'
      - '3000:3000'
    volumes:
      - ./docker/ha/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      engine-1:
        condition: service_healthy
      engine-2:
        condition: service_healthy
    restart: unless-stopped

  engine-1: &engine
    build:
      context: .
      target: engine
    container_name: aether-vault-ha-engine-1
    # `host.docker.internal` needs this explicit mapping on a genuinely Linux Docker
    # Engine host (this repo's own CI runner); without it, ha_drill.sh's phase 3
    # webhook probe resolves to nothing. `host-gateway` (Engine 20.10+) is a no-op on
    # Docker Desktop, which already resolves the name itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ha_vault_data:/data
    environment: &engine_env
      - AV_DATA_DIR=/data
      - AV_ENGINE_ROLE=all
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
      - WEBUI_PORT=3000
      - DATABASE_URL=postgresql+asyncpg://av_user:av_password@db-primary:5432/aether_vault
      # Request-serving sessions use the non-superuser role in the HA topology too,
      # same as docker-compose.yml -- see database.py's APP_DATABASE_URL docstring.
      - AV_APP_DATABASE_URL=postgresql+asyncpg://av_app:av_app_password@db-primary:5432/aether_vault
      - REDIS_URL=redis://redis-primary:6379/0
      - AV_API_TOKEN=${AV_API_TOKEN:-}
      - AV_AUTH_USERS=${AV_AUTH_USERS:-}
      # Opts in to the cross-replica-safe Redis-backed rate limiter and auth-spike
      # counter -- the in-process defaults are actively wrong under N replicas. This is
      # the one place in the repo where turning these on is the correct default.
      - AV_RATE_LIMIT_BACKEND=redis
      - AV_AUTH_SPIKE_BACKEND=redis
      # Left unset (unlimited data plane) unless the caller opts in -- scripts/ha_drill.sh
      # sets this for its own run only, to prove the Redis backend enforces one global
      # limit across replicas rather than N independent ones.
      - AV_RATE_LIMIT_DEFAULT=${AV_RATE_LIMIT_DEFAULT:-}
      # Footprint knobs (V1.6.3) -- see development/infrastructure.md for each.
      - AV_UVICORN_WORKERS=${AV_UVICORN_WORKERS:-1}
      - AV_UVICORN_LIMIT_CONCURRENCY=${AV_UVICORN_LIMIT_CONCURRENCY:-}
      - AV_WEBUI_NODE_HEAP_MB=${AV_WEBUI_NODE_HEAP_MB:-256}
      - AV_DB_POOL_SIZE=${AV_DB_POOL_SIZE:-10}
      - AV_DB_MAX_OVERFLOW=${AV_DB_MAX_OVERFLOW:-20}
      - AV_MAX_UPLOAD_BYTES=${AV_MAX_UPLOAD_BYTES:-0}
    depends_on:
      db-primary:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    deploy: &engine_deploy
      resources:
        limits:
          memory: ${AV_ENGINE_MEM_LIMIT:-768M}
    # Role-aware bash probe (docker/engine-healthcheck.sh, baked into the image): no
    # python/node fork per tick.
    healthcheck: &engine_healthcheck
      test: ["CMD", "/engine-healthcheck.sh"]
      interval: ${AV_HEALTHCHECK_INTERVAL:-30s}
      timeout: 10s
      retries: 5
      start_period: 40s

  engine-2:
    <<: *engine
    container_name: aether-vault-ha-engine-2

  db-primary:
    image: postgres:15-alpine
    container_name: aether-vault-ha-db-primary
    environment:
      POSTGRES_USER: av_user
      POSTGRES_PASSWORD: av_password
      POSTGRES_DB: aether_vault
    # Memory tunables first (V1.6.3, same defaults as docker-compose.yml), then the
    # replication flags this topology needs.
    command: >
      postgres
      -c shared_buffers=${AV_PG_SHARED_BUFFERS:-64MB}
      -c work_mem=${AV_PG_WORK_MEM:-4MB}
      -c maintenance_work_mem=${AV_PG_MAINT_WORK_MEM:-32MB}
      -c effective_cache_size=${AV_PG_EFFECTIVE_CACHE:-256MB}
      -c max_connections=${AV_PG_MAX_CONNECTIONS:-100}
      -c wal_level=replica -c max_wal_senders=10
      -c max_replication_slots=10 -c hot_standby=on
    deploy:
      resources:
        limits:
          memory: ${AV_DB_MEM_LIMIT:-256M}
    volumes:
      - ha_postgres_primary_data:/var/lib/postgresql/data
      - ./docker/ha/postgres-primary-init.sh:/docker-entrypoint-initdb.d/00-primary-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_user -d aether_vault"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-replica:
    image: postgres:15-alpine
    container_name: aether-vault-ha-db-replica
    entrypoint: ["/bin/bash", "/docker-ha/postgres-replica-entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: ${AV_DB_MEM_LIMIT:-256M}
    volumes:
      - ha_postgres_replica_data:/var/lib/postgresql/data
      - ./docker/ha/postgres-replica-entrypoint.sh:/docker-ha/postgres-replica-entrypoint.sh:ro
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_user -d aether_vault"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis-primary:
    image: redis/redis-stack-server:latest
    container_name: aether-vault-ha-redis-primary
    # volatile-lru: the Bloom filter key has no TTL and is never evicted; see
    # docker-compose.yml's redis service for the full reasoning.
    environment:
      - REDIS_ARGS=--maxmemory ${AV_REDIS_MAXMEMORY:-128mb} --maxmemory-policy volatile-lru
    deploy:
      resources:
        limits:
          memory: ${AV_REDIS_MEM_LIMIT:-192M}
    volumes:
      - ha_redis_primary_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-replica:
    image: redis/redis-stack-server:latest
    container_name: aether-vault-ha-redis-replica
    # NOT a `command:` override -- this image's default CMD is `/entrypoint.sh` itself
    # with no separate ENTRYPOINT, so a `command:` override would replace that script
    # entirely instead of passing arguments to it. REDIS_ARGS is the image's actual
    # supported extension point.
    environment:
      - REDIS_ARGS=--replicaof redis-primary 6379 --maxmemory ${AV_REDIS_MAXMEMORY:-128mb} --maxmemory-policy volatile-lru
    deploy:
      resources:
        limits:
          memory: ${AV_REDIS_MEM_LIMIT:-192M}
    volumes:
      - ha_redis_replica_data:/data
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ha_vault_data:
    driver: local
  ha_postgres_primary_data:
    driver: local
  ha_postgres_replica_data:
    driver: local
  ha_redis_primary_data:
    driver: local
  ha_redis_replica_data:
    driver: local
