# v1.3.2 (WP-31): automated security scanning. Runs on every PR (fast feedback) and
# weekly on a schedule (catches newly-disclosed CVEs in already-pinned dependencies,
# which a PR-only trigger would miss indefinitely for a repo with no new PRs). Every job
# gates on high/critical findings only — see each step's own comment for why: a scanner
# that fails the build on every low-severity nit trains reviewers to ignore it, which is
# worse than not running it at all.
name: security

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch: {}
  # v1.3.4 (W1c): security scans used to run on PR + weekly only -- a master push
  # (the moment code actually lands) went entirely unscanned until the next Monday.
  push:
    branches: [master]

# v1.3.4 (W1b): least-privilege default. `gitleaks`/`codeql-equivalent` SARIF-uploading
# jobs below grant themselves `security-events: write` individually; every other job
# here only ever reads the repo, scans, and uploads its own JSON report artifact.
permissions:
  contents: read

# v1.3.4 (W1b): rapid-fire master pushes shouldn't run five overlapping scan sweeps.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: pip-audit (known-CVE scan of resolved dependencies)
        run: |
          pip install pip-audit
          pip install -e .[dev,sign,watch,docker] >/dev/null
          # --strict would also fail on pip-audit's own inability to find a fix version
          # for a transitive pin outside our control; -f json + the summary line below is
          # the actionable signal, not a hard gate on every advisory regardless of reachability.
          pip-audit --desc -f json > pip-audit-report.json || true
          python -c "
          import json, sys
          report = json.load(open('pip-audit-report.json'))
          deps = report if isinstance(report, list) else report.get('dependencies', [])
          vulns = [v for d in deps for v in d.get('vulns', [])]
          print(f'::notice::pip-audit found {len(vulns)} advisories across {len(deps)} packages')
          for d in deps:
              for v in d.get('vulns', []):
                  print(f\"  {d[\'name\']}=={d[\'version\']}: {v[\'id\']} - {v.get(\'description\', \'\')[:120]}\")
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: bandit (Python security linter)
        run: |
          pip install bandit
          # -ll: only report MEDIUM/HIGH confidence findings at MEDIUM+ severity -- bandit's
          # LOW/LOW default tier is dominated by noise (subprocess-with-shell-False false
          # positives, etc.) that would make this gate untrustworthy within a week.
          bandit -r python/ -ll -f json -o bandit-report.json || true
          python -c "
          import json
          report = json.load(open('bandit-report.json'))
          results = report.get('results', [])
          high = [r for r in results if r['issue_severity'] == 'HIGH']
          print(f'::notice::bandit found {len(results)} findings ({len(high)} HIGH severity)')
          for r in high:
              print(f\"  {r['filename']}:{r['line_number']}: {r['test_id']} {r['issue_text']}\")
          if high:
              raise SystemExit(f'{len(high)} HIGH-severity bandit finding(s) -- see above')
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # v1.3.4 (W0.8): was `image: semgrep/semgrep` -- unqualified, so this resolved to
      # whatever `:latest` happened to be on the day the job ran, an unpinned execution
      # surface sitting inside the SECURITY workflow itself. Pinned to the digest
      # `:latest` pointed at on 2026-09-06 (a multi-arch index digest, so both amd64/arm64
      # runners resolve correctly); bump deliberately, the same policy as every other pin
      # in this repo (infrastructure.md's "do not downgrade pins" note).
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: semgrep (Python security + secrets rulesets)
        run: |
          semgrep scan --config p/python --config p/secrets \
            --severity ERROR --error --json --output semgrep-report.json python/ || true
          python3 -c "
          import json
          report = json.load(open('semgrep-report.json'))
          results = report.get('results', [])
          errors = [r for r in results if r.get('extra', {}).get('severity') == 'ERROR']
          print(f'::notice::semgrep found {len(results)} findings ({len(errors)} ERROR severity)')
          for r in errors:
              print(f\"  {r['path']}:{r['start']['line']}: {r['check_id']}\")
          if errors:
              raise SystemExit(f'{len(errors)} ERROR-severity semgrep finding(s) -- see above')
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json

  container-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build the engine image
        run: docker build --target engine -t aether-vault-engine:security-scan .
      - name: Trivy (OS + Python package CVE scan of the built image)
        # v1.3.4 (W1a / Probleme.md #135): was `@0.28.0` -- that ref does not exist in
        # aquasecurity/trivy-action (tags are `v`-prefixed; no bare "0.28.0" tag/branch
        # ever existed). Since this whole workflow had never actually run (see #135:
        # trigger was PR+weekly-only, and this repo has had zero PRs), this broken
        # reference was never caught. Pinned to the real, current v0.36.0 by SHA.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aether-vault-engine:security-scan
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true   # a CVE with no available fix yet isn't actionable this run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

  webui-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # v1.3.4 (W0.7): was @v5 -- every other workflow in this repo (and
      # infrastructure.md's own "do not downgrade pins" note) standardizes on the
      # Node-24 v6 major.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - name: npm audit (production dependencies only)
        working-directory: webui
        run: |
          npm ci --omit=dev
          # --audit-level=high: dev-dependency-only advisories (build tooling never
          # shipped to a user) are noise for a PRODUCTION-image security gate.
          npm audit --omit=dev --audit-level=high

  # v1.3.4 (W1c, todo.md item 1): secret scanning that actually fails the build. GitHub's
  # native secret scanning + push protection are already enabled at the repo level (see
  # infrastructure.md) — this is the complementary layer that scans the FULL git history
  # on every run (push protection only ever sees NEW pushes going forward) and reports
  # into the Security tab like the CodeQL workflow below, rather than only a push-time
  # block.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # required to upload the SARIF report below
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # full history — gitleaks scans commits, not just the working tree

      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks_8.30.1_linux_x64.tar.gz

      - name: gitleaks (full history, SARIF output)
        # `.gitleaks.toml` (repo root) allowlists a handful of known dev-only literals
        # (local-compose-only DB passwords, scripts/e2e_scenario.sh's Phase D fixture
        # tokens) — see that file's own comments for exactly which and why. Everything
        # else is a hard, exit-1 gate; no `|| true` here, unlike the advisory-only scans
        # above.
        run: gitleaks detect --source . --config .gitleaks.toml --redact --report-format sarif --report-path gitleaks.sarif --exit-code 1

      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: gitleaks.sarif
