# Automated security scanning. Runs on every PR, weekly on a schedule (catches
# newly-disclosed CVEs in already-pinned dependencies), and on master push. Every job
# gates on high/critical findings only — a scanner that fails on every low-severity nit
# trains reviewers to ignore it.
name: security

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch: {}
  push:
    branches: [master]

# Least-privilege default. SARIF-uploading jobs below grant `security-events: write`
# individually; every other job only reads the repo, scans, and uploads its own report.
permissions:
  contents: read

# Rapid-fire master pushes shouldn't run five overlapping scan sweeps.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: pip-audit (known-CVE scan of resolved dependencies)
        run: |
          pip install pip-audit
          pip install -e .[dev,sign,watch,docker] >/dev/null
          # --strict would also fail on pip-audit's own inability to find a fix version
          # for a transitive pin outside our control; the summary line below is the
          # actionable signal instead.
          pip-audit --desc -f json > pip-audit-report.json || true
          python -c "
          import json, sys
          report = json.load(open('pip-audit-report.json'))
          deps = report if isinstance(report, list) else report.get('dependencies', [])
          vulns = [v for d in deps for v in d.get('vulns', [])]
          print(f'::notice::pip-audit found {len(vulns)} advisories across {len(deps)} packages')
          for d in deps:
              for v in d.get('vulns', []):
                  print(f\"  {d['name']}=={d['version']}: {v['id']} - {v.get('description', '')[:120]}\")
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: bandit (Python security linter)
        run: |
          pip install bandit
          # -ll: only MEDIUM/HIGH confidence at MEDIUM+ severity -- bandit's LOW/LOW
          # default tier is dominated by noise that would make this gate untrustworthy.
          bandit -r python/ -ll -f json -o bandit-report.json || true
          python -c "
          import json
          report = json.load(open('bandit-report.json'))
          results = report.get('results', [])
          high = [r for r in results if r['issue_severity'] == 'HIGH']
          print(f'::notice::bandit found {len(results)} findings ({len(high)} HIGH severity)')
          for r in high:
              print(f\"  {r['filename']}:{r['line_number']}: {r['test_id']} {r['issue_text']}\")
          if high:
              raise SystemExit(f'{len(high)} HIGH-severity bandit finding(s) -- see above')
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Pinned by digest (not `:latest`) -- a multi-arch index digest, so both
      # amd64/arm64 runners resolve correctly; bump deliberately.
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: semgrep (Python security + secrets rulesets)
        run: |
          # Migrations are excluded by path: Alembic legitimately uses sa.text()/
          # op.execute() for DDL/DML the ORM can't express, with hardcoded internal
          # names and real bind params, not string-concatenated external input -- the
          # actual injection pattern this rule exists to catch.
          semgrep scan --config p/python --config p/secrets \
            --exclude 'python/av_server/migrations/versions/*' \
            --severity ERROR --error --json --output semgrep-report.json python/ || true
          python3 -c "
          import json
          report = json.load(open('semgrep-report.json'))
          results = report.get('results', [])
          errors = [r for r in results if r.get('extra', {}).get('severity') == 'ERROR']
          print(f'::notice::semgrep found {len(results)} findings ({len(errors)} ERROR severity)')
          for r in errors:
              print(f\"  {r['path']}:{r['start']['line']}: {r['check_id']}\")
          if errors:
              raise SystemExit(f'{len(errors)} ERROR-severity semgrep finding(s) -- see above')
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json

  container-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build the engine image
        run: docker build --target engine -t aether-vault-engine:security-scan .
      - name: Trivy (OS + Python package CVE scan of the built image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aether-vault-engine:security-scan
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true   # a CVE with no available fix yet isn't actionable this run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

  webui-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - name: npm audit (production dependencies only)
        working-directory: webui
        run: |
          npm ci --omit=dev
          # --audit-level=high: dev-dependency-only advisories (build tooling never
          # shipped to a user) are noise for a PRODUCTION-image security gate.
          npm audit --omit=dev --audit-level=high

  # Secret scanning that actually fails the build. Complements GitHub's native secret
  # scanning + push protection by scanning the full git history on every run.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # required to upload the SARIF report below
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # full history — gitleaks scans commits, not just the working tree

      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks_8.30.1_linux_x64.tar.gz

      - name: gitleaks (full history, SARIF output)
        # `.gitleaks.toml` allowlists a handful of known dev-only literals; everything
        # else is a hard, exit-1 gate (no `|| true`, unlike the advisory scans above).
        run: gitleaks detect --source . --config .gitleaks.toml --redact --report-format sarif --report-path gitleaks.sarif --exit-code 1

      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: gitleaks.sarif
