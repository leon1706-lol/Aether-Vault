name: Tests

on:
  push:
  pull_request:

# Superseded runs (rapid-fire pushes) are cancelled — saves runner minutes and makes
# the latest commit's result the authoritative one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Floor (3.10: eager annotations, oldest supported) + ceiling (3.14: newest stable,
        # PEP 649 lazy-annotation semantics). The in-between versions add Windows-runner
        # minutes without covering new failure modes — the static eager-annotation checker
        # covers ≤3.12 semantics. Wider range runs nightly (see nightly.yml).
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        # v1.3.0: [watch] added so tests/test_v120.py's real-watchdog `av watch` test
        # exercises the actual event-driven path here (not just its polling fallback,
        # which runs regardless of whether the extra is installed).
        run: pip install -e .[dev,watch]

      - name: Run test suite
        run: pytest --cov=python --cov-report=term-missing tests/

      # v1.3.0 (todo.md item 22): captures this run's perf numbers as a workflow artifact —
      # trends survive artifact expiry via `scripts/append_perf_history.py`'s SEPARATE,
      # maintainer-run-locally step (never from CI — this project's CI never commits
      # anything back to the repo, see tests/test_ci_policy.py) that appends a row to the
      # committed development/perf-history.json from a downloaded copy of this artifact.
      - name: Capture speedcheck JSON
        if: matrix.python-version == '3.14'
        run: python scripts/append_perf_history.py --dry-run --save-speedcheck-json speedcheck-${{ matrix.python-version }}.json

      - name: Upload speedcheck JSON artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: speedcheck-windows-py${{ matrix.python-version }}
          path: speedcheck-${{ matrix.python-version }}.json
          retention-days: 90

  plugin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault with the Lightning/Transformers/MLflow/sign extras
        # [sign] added in v1.2.2 so the signed-commit gate (tests/test_signing.py) runs
        # here rather than skipping everywhere — this is the only job with the
        # cryptography extra installed by default.
        run: pip install -e .[dev,lightning,transformers,mlflow,sign]

      - name: Run framework-plugin tests (+ signed-commit gate)
        run: pytest tests/test_plugins.py tests/test_signing.py -v

  webui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci

      - name: Lint webui
        working-directory: webui
        run: npm run lint

      - name: Typecheck webui
        working-directory: webui
        run: npm run typecheck

      - name: Run webui Vitest suite
        working-directory: webui
        run: npm test

  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: av_user
          POSTGRES_PASSWORD: av_password
          POSTGRES_DB: aether_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AV_TEST_DATABASE_URL: postgresql+asyncpg://av_user:av_password@localhost:5432/aether_vault_test
      AV_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        run: pip install -e .[dev]

      - name: Start aether-vault-server (for the real-wire test)
        env:
          DATABASE_URL: ${{ env.AV_TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.AV_TEST_REDIS_URL }}
          # Bare-metal uvicorn on the runner has no Docker volume mounted at /data — without
          # a writable CAS dir every object upload fails with PermissionError and the
          # real-wire commit silently queues offline instead of syncing.
          AV_DATA_DIR: ${{ runner.temp }}/av-data
        run: |
          nohup python -m uvicorn av_server.server:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
          # Fail THIS step loudly instead of letting every later test ERROR confusingly —
          # /api/health is auth-exempt and DB-free, so success here means the lifespan ran.
          curl -sf http://localhost:8000/api/health > /dev/null || {
            echo "::error::aether-vault-server did not become healthy in 30s"
            exit 1
          }

      - name: Run av_server tests (TestClient + real-wire) against live Postgres + Redis
        run: pytest tests/test_server.py -v

  # The live layer has only ever been exercised on Linux — Windows path/encoding quirks in
  # the server stayed invisible until a real user hit them. Service containers don't exist
  # on Windows runners, so this twin installs PostgreSQL and Memurai (Redis-compatible)
  # natively via Chocolatey instead.
  server-tests-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      AV_TEST_DATABASE_URL: postgresql+asyncpg://postgres:av_password@localhost:5432/aether_vault_test
      AV_TEST_REDIS_URL: redis://localhost:6379/0
      PGPASSWORD: av_password
      PG_BIN: C:\Program Files\PostgreSQL\15\bin

    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL 15 and Memurai via Chocolatey
        run: |
          choco install postgresql15 --params '/Password:av_password /Port:5432' -y --no-progress
          choco install memurai-developer -y --no-progress

      - name: Create the test database
        shell: pwsh
        run: |
          $env:Path += ";$env:PG_BIN"
          & "$env:PG_BIN\psql.exe" -U postgres -h localhost -d postgres -c "SELECT version()" || Start-Sleep 10
          & "$env:PG_BIN\psql.exe" -U postgres -h localhost -d postgres -c "CREATE DATABASE aether_vault_test;"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        run: pip install -e .[dev]

      - name: Run av_server tests against live native Postgres + Memurai
        shell: pwsh
        run: pytest tests/test_server.py -v

  # Full product flows driven by the REAL av CLI against a REAL server process — the layers
  # unit/TestClient tests cannot reach. See scripts/e2e_scenario.sh for the phase map.
  e2e-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: av_user
          POSTGRES_PASSWORD: av_password
          POSTGRES_DB: aether_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AV_TEST_DATABASE_URL: postgresql+asyncpg://av_user:av_password@localhost:5432/aether_vault_test
      AV_TEST_REDIS_URL: redis://localhost:6379/0
      E2E_PSQL_URL: postgresql://av_user:av_password@localhost:5432/aether_vault_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        # [sign] so e2e Phase J (signed roundtrip) runs; cryptography is a small wheel.
        run: pip install -e .[dev,sign]

      - name: Run end-to-end scenario suite (real CLI ↔ real server)
        shell: bash
        run: bash scripts/e2e_scenario.sh

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-log
          path: /tmp/server-e2e.log
          if-no-files-found: ignore

  # v1.3.0 (todo.md item 28): chaos drills — Phases L/M/N in the same
  # scripts/e2e_scenario.sh (gated behind AV_E2E_CHAOS=1, off by default so this doesn't
  # change e2e-suite's own behavior above). A separate job, not folded into e2e-suite,
  # because these phases kill the server process and make its storage briefly unwritable
  # — deliberately more disruptive than the rest of the suite, worth isolating so a chaos
  # regression's failure signal doesn't get lost among Phases A-K's unrelated assertions.
  chaos-drills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: av_user
          POSTGRES_PASSWORD: av_password
          POSTGRES_DB: aether_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AV_TEST_DATABASE_URL: postgresql+asyncpg://av_user:av_password@localhost:5432/aether_vault_test
      AV_TEST_REDIS_URL: redis://localhost:6379/0
      E2E_PSQL_URL: postgresql://av_user:av_password@localhost:5432/aether_vault_test
      AV_E2E_CHAOS: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        run: pip install -e .[dev]

      - name: Run end-to-end scenario suite with chaos drills (Phases A-N)
        shell: bash
        run: bash scripts/e2e_scenario.sh

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-drills-server-log
          path: /tmp/server-e2e.log
          if-no-files-found: ignore

  # Phase I of the e2e layer (v1.2.2): the ENGINE IMAGE itself is a product surface now.
  # Builds the consolidated image and proves all three dispatch modes from it:
  # role=all (both subservices healthy in ONE container), role=server, role=webui —
  # including the legacy auto-detect that keeps pre-1.2.2 pinned composes working
  # against the aliased aether-vault-server/-webui tags.
  e2e-engine-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Build the engine image
        # v1.3.0 (Probleme.md): explicit target — see release.yml's identical comment.
        run: docker build --target engine -t aether-vault-engine:smoke .

      - name: Role=all — one container, both subservices healthy
        run: |
          docker network create avnet >/dev/null
          docker run -d --name pg --network avnet -e POSTGRES_USER=av_user \
            -e POSTGRES_PASSWORD=av_password -e POSTGRES_DB=aether_vault \
            --health-cmd "pg_isready -U av_user" postgres:15-alpine >/dev/null
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U av_user >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name engine-all --network avnet -p 8000:8000 -p 3000:3000 \
            -e AV_ENGINE_ROLE=all \
            -e DATABASE_URL=postgresql+asyncpg://av_user:av_password@pg:5432/aether_vault \
            -e REDIS_URL=redis://this-host-is-intentionally-absent:6379/0 \
            aether-vault-engine:smoke >/dev/null
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health >/dev/null 2>&1 \
               && curl -sf http://localhost:3000/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [[ "$ok" == 1 ]] || { docker logs engine-all >&2 || true; exit 1; }
          echo "::notice::role=all: registry :8000 AND webui :3000 healthy in one container"

      # v1.2.5: /api/health (liveness) and /api/ready (readiness) must actually diverge —
      # this container's REDIS_URL points at a host that doesn't exist, so /api/ready
      # SHOULD report the redis check failing while /api/health stays green regardless
      # (that gap is exactly the "most misleading failure mode" infrastructure.md warns
      # about, now made visible instead of silent).
      - name: Role=all — /api/ready degrades independently of /api/health
        run: |
          curl -sf http://localhost:8000/api/health >/dev/null 2>&1 || {
            echo "::error::health should stay up regardless of readiness"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/ready)
          [[ "$code" == "503" ]] || {
            echo "::error::expected 503 from /api/ready (redis intentionally unreachable), got $code"
            curl -s http://localhost:8000/api/ready; exit 1; }
          curl -s http://localhost:8000/api/ready | grep -q '"redis": *false' || {
            echo "::error::/api/ready did not report the redis check as failing"; exit 1; }
          echo "::notice::role=all: /api/health stayed green while /api/ready correctly reported 503"

      # v1.2.5: killing ONE subservice must restart just that subservice, not the whole
      # container — RestartCount unchanged proves engine-entrypoint.sh's own restart
      # loop handled it, not Docker's `restart: unless-stopped` policy on the container.
      - name: Role=all — killing one subservice restarts it, not the container
        run: |
          before=$(docker inspect --format '{{.RestartCount}}' engine-all)
          # v1.2.5.3/.4: a bare `pkill -f ...` under this step's `set -e` aborts the whole
          # step on ITS OWN non-matching-process exit code (1), before the real
          # assertions below ever run — and swallowing that blindly with `|| true`
          # would let the step silently "pass" without having killed anything at all if
          # the pattern ever stops matching. Find the PID explicitly and kill THAT, so a
          # genuine match failure fails loudly with a diagnostic instead of either way.
          # Pattern is "next-server", not "node server.js": Next.js's standalone server
          # calls process.title = "next-server (vX.Y.Z)" once it starts, which on Linux
          # overwrites the process's actual argv/proc/<pid>/cmdline — `ps`/`pgrep -f`
          # both see the renamed title, never the original `node server.js` invocation
          # engine-entrypoint.sh launched it with (confirmed via this step's own `ps aux`
          # diagnostic dump in CI — see Probleme.md).
          webui_pid=$(docker exec engine-all pgrep -f "next-server" | head -1)
          if [[ -z "$webui_pid" ]]; then
            echo "::error::no 'next-server' (webui) process found inside engine-all to kill"
            docker exec engine-all ps aux >&2 || true
            exit 1
          fi
          docker exec engine-all kill "$webui_pid"
          ok=0
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null 2>&1 && { ok=1; break; }
            sleep 1
          done
          [[ "$ok" == 1 ]] || {
            echo "::error::webui did not come back after being killed"
            docker logs engine-all >&2; exit 1; }
          after=$(docker inspect --format '{{.RestartCount}}' engine-all)
          [[ "$before" == "$after" ]] || {
            echo "::error::container RestartCount changed ($before -> $after) — the whole"
            echo "::error::container restarted instead of just the killed subservice"; exit 1; }
          # The server leg (never touched) must still answer throughout.
          curl -sf http://localhost:8000/api/health >/dev/null 2>&1 || {
            echo "::error::server leg went down during a webui-only restart"; exit 1; }
          echo "::notice::role=all: killing webui restarted just that subservice (container RestartCount unchanged: $before)"

      # v1.3.0 (todo.md item 19): the only kill test above (subservice restart) kills an
      # IDLE process — nothing anywhere proved an in-flight request actually survives a
      # real drain. Fresh container so we can set a short, CI-fast --stop-timeout/grace
      # pair (AV_ENGINE_STOP_GRACE_SECS=8, docker --stop-timeout 20 comfortably above it —
      # see infrastructure.md's orchestrator readiness/liveness section for why the two
      # must stay in that order for a real deployment).
      - name: Drain under load — in-flight uploads survive a real SIGTERM
        run: |
          docker run -d --name engine-drain --network avnet -p 8020:8000 \
            -e AV_ENGINE_ROLE=all -e AV_ENGINE_STOP_GRACE_SECS=8 --stop-timeout 20 \
            -e DATABASE_URL=postgresql+asyncpg://av_user:av_password@pg:5432/aether_vault \
            -e REDIS_URL=redis://this-host-is-intentionally-absent:6379/0 \
            aether-vault-engine:smoke >/dev/null
          ok=0
          for i in $(seq 1 60); do
            curl -sf http://localhost:8020/api/health >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [[ "$ok" == 1 ]] || { docker logs engine-drain >&2 || true; exit 1; }

          # 20 concurrent object uploads, fired in the background; SIGTERM lands on the
          # container while at least some of these are genuinely still in flight. Each
          # writes its own curl exit code + HTTP status so none can be silently dropped.
          RESULTS=$(mktemp -d)
          for i in $(seq 1 20); do
            (
              body=$(mktemp); head -c $((256 * 1024)) /dev/urandom > "$body"
              hash=$(sha256sum "$body" | cut -d' ' -f1)
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
                     -X POST --data-binary "@$body" "http://localhost:8020/api/objects/$hash")
              echo "$code" > "$RESULTS/$i"
              rm -f "$body"
            ) &
          done
          sleep 0.3   # let the batch actually start connecting before we pull the rug
          docker stop --time 20 engine-drain >/dev/null
          wait   # every backgrounded curl must finish (successfully or not) before we score it

          failed=0
          for i in $(seq 1 20); do
            code=$(cat "$RESULTS/$i" 2>/dev/null || echo "MISSING")
            if [[ "$code" != "201" && "$code" != "200" ]]; then
              echo "::error::upload $i did not complete cleanly during drain (got: $code)"
              failed=1
            fi
          done
          [[ "$failed" == 0 ]] || { docker logs engine-drain >&2 || true; exit 1; }
          echo "::notice::all 20 in-flight uploads completed cleanly across a real SIGTERM drain"
          docker rm -f engine-drain >/dev/null 2>&1 || true

      - name: Role=server + legacy auto-detect dispatch
        run: |
          docker stop engine-all >/dev/null
          # Explicit role:
          docker run -d --name engine-srv --network avnet -p 8010:8000 \
            -e AV_ENGINE_ROLE=server \
            -e DATABASE_URL=postgresql+asyncpg://av_user:av_password@pg:5432/aether_vault \
            aether-vault-engine:smoke >/dev/null
          # Legacy alias behavior: NO AV_ENGINE_ROLE, but DATABASE_URL set → server-only
          # (this is exactly what pre-1.2.2 pinned compose files produce).
          docker run -d --name engine-legacy --network avnet \
            -e DATABASE_URL=postgresql+asyncpg://av_user:av_password@pg:5432/aether_vault \
            aether-vault-engine:smoke >/dev/null
          ok=0
          for i in $(seq 1 60); do
            curl -sf http://localhost:8010/api/health >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [[ "$ok" == 1 ]] || { docker logs engine-srv >&2 || true; exit 1; }
          sleep 8
          # The webui must NOT be running under either server-role container. Checks for
          # "next-server" (the running webui's actual, self-renamed process title — see
          # Probleme.md #103), NOT "node server.js" (the launch invocation, which Next.js
          # overwrites the instant it finishes booting) — the old pattern silently never
          # matched even when the webui WAS running, making this assertion a no-op that
          # always passed regardless of the real answer.
          if docker top engine-srv | grep -q "[n]ext-server"; then
            echo "::error::AV_ENGINE_ROLE=server started the webui too"; exit 1; fi
          if docker top engine-legacy | grep -q "[n]ext-server"; then
            echo "::error::legacy auto-detect started the webui too"; exit 1; fi
          # Legacy container's own registry must be healthy on its unmapped :8000:
          docker exec engine-legacy python -c \
            "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()" || {
            echo "::error::legacy auto-detect did not start the registry"; exit 1; }

      - name: Role=webui — standalone Next server only
        run: |
          docker run -d --name engine-webui -p 3001:3000 \
            -e AV_ENGINE_ROLE=webui -e NEXT_PUBLIC_API_URL=http://localhost:8000 \
            aether-vault-engine:smoke >/dev/null
          ok=0
          for i in $(seq 1 45); do
            curl -sf http://localhost:3001/ >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [[ "$ok" == 1 ]] || { docker logs engine-webui >&2 || true; exit 1; }
          if docker top engine-webui | grep -q "[u]vicorn"; then
            echo "::error::AV_ENGINE_ROLE=webui started the registry too"; exit 1; fi

      - name: Cleanup
        if: always()
        run: |
          docker rm -f engine-all engine-drain engine-srv engine-legacy engine-webui pg >/dev/null 2>&1 || true
          docker network rm avnet >/dev/null 2>&1 || true

  # First time release artifacts are ever INSTALLED rather than just built: a wheel goes
  # into a clean Linux venv, and the sdist is compiled from scratch inside a clean Windows
  # venv (validating the MSVC/CMake path end users hit when no wheel matches).
  package-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke-wheel-linux:
    needs: package-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the built wheel into a clean venv
        run: |
          python -m venv "$GITHUB_WORKSPACE/clean"
          "$GITHUB_WORKSPACE/clean/bin/python" -m pip install ./dist/*.whl

      - name: Offline sanity roundtrip through the installed console script
        run: |
          AV="$GITHUB_WORKSPACE/clean/bin/av"
          PYBIN="$GITHUB_WORKSPACE/clean/bin/python"
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          "$AV" --version
          "$PYBIN" -c "import av_cli, av_server"
          # v1.2.2 packaging gates: the context-diff and registry surfaces must ship in
          # the wheel (they were both missing-at-runtime classes of bug historically).
          "$AV" diff --help > /dev/null
          "$AV" registry --help > /dev/null
          "$AV" init --mode local --yes --no-repl
          echo "packaged" > f.txt
          "$AV" add f.txt
          "$AV" commit -m "wheel-smoke"
          "$AV" log | grep "wheel-smoke"
          # v1.3.0 contract freeze (todo.md #27): pyproject.toml's own
          # [tool.setuptools.package-data] only lists "docker/*.yml" for av_cli — it can
          # silently shadow setup.py's package_data (which DOES list
          # "schemas/*.schema.json"). This is the one place that proves the schemas
          # actually landed in the wheel installed into a clean venv, not just in the
          # checkout.
          "$PYBIN" -c "
          import importlib.resources as r
          names = {'envelope-1.0','event-1.0','run-1.0','webhook-payload-1.0','semdiff-1.0','avh-2.0'}
          for name in names:
              ref = r.files('av_cli').joinpath('schemas', f'{name}.schema.json')
              assert ref.is_file(), f'{name}.schema.json missing from installed wheel'
          print('all contract schemas present in wheel')
          "

  smoke-sdist-windows:
    needs: package-build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile-install the sdist into a clean venv (MSVC + CMake path)
        shell: pwsh
        run: |
          python -m venv "$env:GITHUB_WORKSPACE\clean"
          $sdist = (Get-Item ./dist/*.tar.gz).FullName
          & "$env:GITHUB_WORKSPACE\clean\Scripts\python.exe" -m pip install $sdist

      - name: Offline sanity roundtrip through the installed console script
        shell: pwsh
        run: |
          $av = "$env:GITHUB_WORKSPACE\clean\Scripts\av.exe"
          $py = "$env:GITHUB_WORKSPACE\clean\Scripts\python.exe"
          $scratch = Join-Path $env:RUNNER_TEMP "av-sdist-smoke"
          New-Item -ItemType Directory -Force $scratch | Out-Null
          Set-Location $scratch
          & $av --version
          & $py -c "import av_cli, av_server"
          # v1.2.2 packaging gates: context-diff + registry surfaces present in the sdist.
          & $av diff --help *> $null
          & $av registry --help *> $null
          & $av init --mode local --yes --no-repl
          Set-Content -Path f.txt -Value packaged
          & $av add f.txt
          & $av commit -m sdist-smoke
          (& $av log) | Select-String sdist-smoke

  webui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: av_user
          POSTGRES_PASSWORD: av_password
          POSTGRES_DB: aether_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault (for the av CLI used by webui/e2e/seed_data.py)
        run: pip install -e .

      - name: Start aether-vault-server
        env:
          DATABASE_URL: postgresql+asyncpg://av_user:av_password@localhost:5432/aether_vault
          REDIS_URL: redis://localhost:6379/0
          # Bare-metal uvicorn has no Docker volume at /data — without a writable CAS dir
          # object uploads 500, seed_data's pushes queue offline, and the dashboard renders
          # empty (Playwright then fails with element-not-found).
          AV_DATA_DIR: ${{ runner.temp }}/av-data
        run: |
          nohup python -m uvicorn av_server.server:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
          # Fail THIS step loudly instead of letting seed/E2E fail with misleading symptoms —
          # the v1.1.6–v1.1.8 runs showed "Seeded N commits" against a schema-less server.
          curl -sf http://localhost:8000/api/health > /dev/null || {
            echo "::error::aether-vault-server did not become healthy in 30s"
            exit 1
          }
          # The health endpoint is DB-free; also assert the SCHEMA actually came up (the
          # Probleme.md #70 rollback class fails startup cleanly but leaves health green).
          psql "postgresql://av_user:av_password@localhost:5432/aether_vault" \
            -c "SELECT 1 FROM alembic_version" > /dev/null || {
            echo "::error::server up but migration chain did not commit (schema missing)"
            exit 1
          }

      - name: Seed checkpoint data via the real av CLI
        run: python webui/e2e/seed_data.py

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: webui
        run: npx playwright install --with-deps chromium

      # Built fresh in this job (not the docker-compose webui image) so the E2E run always
      # exercises the current checkout's source, not a stale cached Docker layer — that
      # exact staleness once produced a passing-looking-but-broken local run, see
      # development/Probleme.md.
      - name: Build and start the webui
        working-directory: webui
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm run build
          nohup npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && break
            sleep 1
          done

      - name: Run Playwright E2E tests (anonymous-mode specs)
        working-directory: webui
        run: npx playwright test dashboard.spec.ts weight-diff.spec.ts runs.spec.ts

      # Browser-level Protected-mode coverage: restart THE SAME server in Protected mode
      # (same DB/data, so seeded content stays visible), then drive the ?av_token= handoff
      # — token consumed, URL stripped, localStorage persisted, dashboard renders behind
      # the gate. Wrong-token must show the entry prompt instead of data.
      - name: Restart server in Protected mode
        run: |
          pkill -f "uvicorn av_server.server:app" || true
          sleep 2
          cd "$GITHUB_WORKSPACE"
          DATABASE_URL=postgresql+asyncpg://av_user:av_password@localhost:5432/aether_vault \
          REDIS_URL=redis://localhost:6379/0 \
          AV_DATA_DIR=${{ runner.temp }}/av-data \
          AV_API_TOKEN=owner-browser-secret AV_AUTH_USERS='{"alice":"alice-browser-token"}' \
            nohup python -m uvicorn av_server.server:app --host 0.0.0.0 --port 8000 \
            > /tmp/prot-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
          [[ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/refs)" == "401" ]] || {
            echo "::error::server did not come up in Protected mode"; exit 1; }

      - name: Run browser-level token-gate E2E
        working-directory: webui
        run: npx playwright test token-gate.spec.ts

      # Ground truth for any token-gate failure: the protected server's OWN access log
      # (orphaned-process stdout otherwise vanishes between step log sections).
      - name: Dump protected-server access log
        if: always()
        run: tail -n 60 /tmp/prot-server.log 2>/dev/null || echo "(no log)"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: webui/playwright-report/
          retention-days: 7
