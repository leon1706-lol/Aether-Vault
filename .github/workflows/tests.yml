name: Tests

on:
  push:
  pull_request:

# Least-privilege default -- every job here only reads the repo, builds, and uploads
# its own artifacts.
permissions:
  contents: read

# Superseded runs (rapid-fire pushes) are cancelled — saves runner minutes and makes
# the latest commit's result the authoritative one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    # ~20min typical; 25min left too little margin and got a slow-runner run cancelled
    # near the finish line (95% done, no hang). 40min gives real headroom.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Floor (3.10: eager annotations) + ceiling (3.14: PEP 649 lazy-annotation
        # semantics). Wider range runs nightly (see nightly.yml).
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        # [watch] so tests/test_v120.py's real-watchdog `av watch` test exercises the
        # actual event-driven path, not just its polling fallback.
        run: pip install -e .[dev,watch]

      - name: Run test suite
        # Output tee'd to a log so the freshness check below can re-parse this same
        # run's summary line. `exit $LASTEXITCODE` is required: once piped through
        # Tee-Object, pytest is no longer the last command PowerShell's wrapper inspects.
        run: |
          pytest --cov=python --cov-report=term-missing tests/ 2>&1 | Tee-Object -FilePath pytest_output.log
          exit $LASTEXITCODE

      # This job runs bare `pytest`, never `av test`, so nothing else re-checks the
      # test-count badge/prose against reality. One matrix leg only, since both legs
      # collect the same tests.
      - name: Check README test-count freshness
        if: matrix.python-version == '3.14'
        run: python scripts/check_readme_test_freshness.py pytest_output.log

      # Captures this run's perf numbers as a workflow artifact; trends survive artifact
      # expiry via append_perf_history.py's separate, maintainer-run-locally step
      # (never from CI, since this project's CI never commits back to the repo).
      - name: Capture speedcheck JSON
        if: matrix.python-version == '3.14'
        run: python scripts/append_perf_history.py --dry-run --save-speedcheck-json speedcheck-${{ matrix.python-version }}.json

      - name: Upload speedcheck JSON artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speedcheck-windows-py${{ matrix.python-version }}
          path: speedcheck-${{ matrix.python-version }}.json
          retention-days: 90

  # The floor+ceiling Linux twin of `test` above (the platform this project actually
  # deploys containers on), plus the coverage gate and slowest-tests report.
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        run: pip install -e .[dev,watch]

      - name: Run test suite (coverage-gated, slowest 25 reported)
        env:
          AV_DATA_DIR: ${{ runner.temp }}/av-data
        # `-m "not flaky"` excludes tests/FLAKES.md-registered flakes from this gating
        # job; `fail_under` is read from pyproject.toml's [tool.coverage.report].
        run: |
          pytest -m "not flaky" --cov=python --cov-report=term-missing --cov-report=xml --cov-report=html --durations=25 tests/ -q

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (test-linux, py${{ matrix.python-version }})"
            echo '```'
            python -m coverage report | tail -5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-linux-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  # Flake quarantine policy — runs only the registered flakes (tests/FLAKES.md),
  # non-gating, so a real regression is still visible in the run summary instead of
  # silently retried or ignored. Starts against an empty registry by design.
  flaky-quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install Aether-Vault
        run: pip install -e .[dev,watch]

      - name: Run only registered-flaky tests (non-gating)
        # pytest exits 5 ("no tests collected") when the -m filter matches nothing,
        # the correct starting state while the registry is empty -- treated as success
        # here so the step itself doesn't show red for the expected/normal case.
        env:
          AV_DATA_DIR: ${{ runner.temp }}/av-data
        run: |
          set +e
          pytest -m flaky -v tests/
          code=$?
          set -e
          [[ "$code" == 0 || "$code" == 5 ]] || exit "$code"

  # A small, named, independently required check so a contract regression shows up as
  # its own red check instead of buried in the 19-minute Windows `test` job's log tail.
  contract-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Aether-Vault
        run: pip install -e .[dev]

      - name: Contract matrix + exit codes + CI policy
        env:
          AV_DATA_DIR: ${{ runner.temp }}/av-data
        run: |
          pytest tests/test_contract_matrix.py tests/test_contracts.py tests/test_exit_codes.py tests/test_ci_policy.py tests/test_helm_chart.py -v

  # A real per-revision upgrade/downgrade drill against a fresh Postgres — stronger than
  # test_server.py's single head-to-base-and-back round trip.
  migrations-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_USER: av_user
          POSTGRES_PASSWORD: av_password
          POSTGRES_DB: aether_vault_migrations_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Aether-Vault
        run: pip install -e .[dev]

      - name: Per-revision upgrade -> downgrade -> re-upgrade drill
        env:
          DATABASE_URL: postgresql+asyncpg://av_user:av_password@localhost:5432/aether_vault_migrations_drill
        run: python scripts/migrations_drill.py

  # Lints .github/workflows/*.yml and every shell script this repo ships -- no
  # services, no build, runs on every push in well under a minute.
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install actionlint (checksum-verified)
        run: |
          curl -sLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          rm actionlint_1.7.12_linux_amd64.tar.gz

      - name: actionlint
        # actionlint runs shellcheck over every embedded `run:` block at every severity
        # with no flag to raise the floor, so specific non-error codes (SC2034, SC2015,
        # SC2129, SC2012, SC2102 -- none a real bug in this controlled CI context) are
        # named explicitly here rather than silencing shellcheck wholesale, so a real
        # error-level finding in a future `run:` block still fails this job.
        run: >-
          actionlint -color
          -ignore 'SC2034:' -ignore 'SC2015:' -ignore 'SC2129:'
          -ignore 'SC2012:' -ignore 'SC2102:'

      - name: shellcheck (scripts/ + docker/ha/*.sh)
        # -S error: this repo's scripts lean on bash-specific constructs that trip a
        # lot of shellcheck's stylistic defaults on purpose; error-level keeps the gate
        # meaningful instead of training reviewers to ignore it.
        run: |
          shopt -s globstar
          shellcheck -S error scripts/*.sh docker/ha/*.sh

  plugin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault with the Lightning/Transformers/MLflow/sign extras
        # [sign] so the signed-commit gate (tests/test_signing.py) runs here rather than
        # skipping everywhere -- this is the only job with cryptography installed by default.
        run: pip install -e .[dev,lightning,transformers,mlflow,sign]

      - name: Run framework-plugin tests (+ signed-commit gate)
        run: pytest tests/test_plugins.py tests/test_signing.py -v

  webui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci

      - name: Lint webui
        working-directory: webui
        run: npm run lint

      - name: Typecheck webui
        working-directory: webui
        run: npm run typecheck

      - name: Run webui Vitest suite
        working-directory: webui
        run: npm test

  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_USER: av_user
          POSTGRES_PASSWORD: av_password
          POSTGRES_DB: aether_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis/redis-stack-server:latest@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AV_TEST_DATABASE_URL: postgresql+asyncpg://av_user:av_password@localhost:5432/aether_vault_test
      AV_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        # [sign] so TestSsoCrypto's real Fernet-encryption path is exercised somewhere
        # against live Postgres+Redis -- test_server.py importorskip()s it when absent.
        run: pip install -e .[dev,sign]

      - name: Start aether-vault-server (for the real-wire test)
        env:
          DATABASE_URL: ${{ env.AV_TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.AV_TEST_REDIS_URL }}
          # Bare-metal uvicorn on the runner has no Docker volume mounted at /data --
          # without a writable CAS dir every upload fails and the commit queues offline.
          AV_DATA_DIR: ${{ runner.temp }}/av-data
        run: |
          nohup python -m uvicorn av_server.server:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
          # Fail this step loudly instead of letting every later test ERROR confusingly.
          curl -sf http://localhost:8000/api/health > /dev/null || {
            echo "::error::aether-vault-server did not become healthy in 30s"
            exit 1
          }

      - name: Run av_server tests (TestClient + real-wire) against live Postgres + Redis
        run: pytest tests/test_server.py -v

  # The live layer has only ever been exercised on Linux — Windows path/encoding quirks in
  # the server stayed invisible until a real user hit them. Service containers don't exist
  # on Windows runners, so this twin installs PostgreSQL and Memurai (Redis-compatible)
  # natively via Chocolatey instead.
  server-tests-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      AV_TEST_DATABASE_URL: postgresql+asyncpg://postgres:av_password@localhost:5432/aether_vault_test
      AV_TEST_REDIS_URL: redis://localhost:6379/0
      PGPASSWORD: av_password
      PG_BIN: C:\Program Files\PostgreSQL\15\bin

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install PostgreSQL 15 and Memurai via Chocolatey
        run: |
          choco install postgresql15 --params '/Password:av_password /Port:5432' -y --no-progress
          choco install memurai-developer -y --no-progress

      - name: Create the test database
        shell: pwsh
        run: |
          $env:Path += ";$env:PG_BIN"
          & "$env:PG_BIN\psql.exe" -U postgres -h localhost -d postgres -c "SELECT version()" || Start-Sleep 10
          & "$env:PG_BIN\psql.exe" -U postgres -h localhost -d postgres -c "CREATE DATABASE aether_vault_test;"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        run: pip install -e .[dev,sign]

      - name: Run av_server tests against live native Postgres + Memurai
        shell: pwsh
        run: pytest tests/test_server.py -v

  # Full product flows driven by the REAL av CLI against a REAL server process — the layers
  # unit/TestClient tests cannot reach. See scripts/e2e_scenario.sh for the phase map.
  e2e-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_USER: av_user
          POSTGRES_PASSWORD: av_password
          POSTGRES_DB: aether_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis/redis-stack-server:latest@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AV_TEST_DATABASE_URL: postgresql+asyncpg://av_user:av_password@localhost:5432/aether_vault_test
      AV_TEST_REDIS_URL: redis://localhost:6379/0
      E2E_PSQL_URL: postgresql://av_user:av_password@localhost:5432/aether_vault_test

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        # [sign] so e2e Phase J (signed roundtrip) runs; cryptography is a small wheel.
        run: pip install -e .[dev,sign]

      - name: Run end-to-end scenario suite (real CLI ↔ real server)
        shell: bash
        run: bash scripts/e2e_scenario.sh

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-server-log
          path: /tmp/server-e2e.log
          if-no-files-found: ignore

  # Chaos drills — Phases L/M/N in the same e2e_scenario.sh (gated behind AV_E2E_CHAOS=1).
  # A separate job, not folded into e2e-suite, since these phases kill the server process
  # and make storage briefly unwritable -- worth isolating so a chaos regression's
  # failure signal doesn't get lost among Phases A-K's unrelated assertions.
  chaos-drills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_USER: av_user
          POSTGRES_PASSWORD: av_password
          POSTGRES_DB: aether_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis/redis-stack-server:latest@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AV_TEST_DATABASE_URL: postgresql+asyncpg://av_user:av_password@localhost:5432/aether_vault_test
      AV_TEST_REDIS_URL: redis://localhost:6379/0
      E2E_PSQL_URL: postgresql://av_user:av_password@localhost:5432/aether_vault_test
      AV_E2E_CHAOS: "1"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        run: pip install -e .[dev]

      - name: Run end-to-end scenario suite with chaos drills (Phases A-N)
        shell: bash
        run: bash scripts/e2e_scenario.sh

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chaos-drills-server-log
          path: /tmp/server-e2e.log
          if-no-files-found: ignore

  # The engine image itself is a product surface: builds the consolidated image and
  # proves all three dispatch modes from it -- role=all, role=server, role=webui --
  # including the legacy auto-detect for pinned pre-1.2.2 composes.
  e2e-engine-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build the engine image
        # Explicit target — see release.yml's identical comment.
        run: docker build --target engine -t aether-vault-engine:smoke .

      - name: Role=all — one container, both subservices healthy
        run: |
          docker network create avnet >/dev/null
          docker run -d --name pg --network avnet -e POSTGRES_USER=av_user \
            -e POSTGRES_PASSWORD=av_password -e POSTGRES_DB=aether_vault \
            --health-cmd "pg_isready -U av_user" postgres:15-alpine >/dev/null
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U av_user >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name engine-all --network avnet -p 8000:8000 -p 3000:3000 \
            -e AV_ENGINE_ROLE=all \
            -e DATABASE_URL=postgresql+asyncpg://av_user:av_password@pg:5432/aether_vault \
            -e REDIS_URL=redis://this-host-is-intentionally-absent:6379/0 \
            aether-vault-engine:smoke >/dev/null
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health >/dev/null 2>&1 \
               && curl -sf http://localhost:3000/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [[ "$ok" == 1 ]] || { docker logs engine-all >&2 || true; exit 1; }
          echo "::notice::role=all: registry :8000 AND webui :3000 healthy in one container"

      # /api/health (liveness) and /api/ready (readiness) must actually diverge -- this
      # container's REDIS_URL points at a nonexistent host, so /api/ready should report
      # the redis check failing while /api/health stays green regardless.
      - name: Role=all — /api/ready degrades independently of /api/health
        run: |
          curl -sf http://localhost:8000/api/health >/dev/null 2>&1 || {
            echo "::error::health should stay up regardless of readiness"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/ready)
          [[ "$code" == "503" ]] || {
            echo "::error::expected 503 from /api/ready (redis intentionally unreachable), got $code"
            curl -s http://localhost:8000/api/ready; exit 1; }
          curl -s http://localhost:8000/api/ready | grep -q '"redis": *false' || {
            echo "::error::/api/ready did not report the redis check as failing"; exit 1; }
          echo "::notice::role=all: /api/health stayed green while /api/ready correctly reported 503"

      # Killing ONE subservice must restart just that subservice, not the whole
      # container — RestartCount unchanged proves engine-entrypoint.sh's own restart
      # loop handled it, not Docker's `restart: unless-stopped` policy on the container.
      - name: Role=all — killing one subservice restarts it, not the container
        run: |
          before=$(docker inspect --format '{{.RestartCount}}' engine-all)
          # Find the PID explicitly and kill it (rather than a bare `pkill -f`, which
          # would abort the step on its own non-matching-exit-code under `set -e`).
          # Pattern is "next-server", not "node server.js": Next.js's standalone server
          # renames its own process title on Linux, so `pgrep -f` never sees the launch invocation.
          webui_pid=$(docker exec engine-all pgrep -f "next-server" | head -1)
          if [[ -z "$webui_pid" ]]; then
            echo "::error::no 'next-server' (webui) process found inside engine-all to kill"
            docker exec engine-all ps aux >&2 || true
            exit 1
          fi
          docker exec engine-all kill "$webui_pid"
          ok=0
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null 2>&1 && { ok=1; break; }
            sleep 1
          done
          [[ "$ok" == 1 ]] || {
            echo "::error::webui did not come back after being killed"
            docker logs engine-all >&2; exit 1; }
          after=$(docker inspect --format '{{.RestartCount}}' engine-all)
          [[ "$before" == "$after" ]] || {
            echo "::error::container RestartCount changed ($before -> $after) — the whole"
            echo "::error::container restarted instead of just the killed subservice"; exit 1; }
          # The server leg (never touched) must still answer throughout.
          curl -sf http://localhost:8000/api/health >/dev/null 2>&1 || {
            echo "::error::server leg went down during a webui-only restart"; exit 1; }
          echo "::notice::role=all: killing webui restarted just that subservice (container RestartCount unchanged: $before)"

      # The kill test above kills an idle process -- this proves an in-flight request
      # actually survives a real drain, on a fresh container with a short,
      # CI-fast --stop-timeout/grace pair.
      - name: Drain under load — in-flight uploads survive a real SIGTERM
        run: |
          docker run -d --name engine-drain --network avnet -p 8020:8000 \
            -e AV_ENGINE_ROLE=all -e AV_ENGINE_STOP_GRACE_SECS=8 --stop-timeout 20 \
            -e DATABASE_URL=postgresql+asyncpg://av_user:av_password@pg:5432/aether_vault \
            -e REDIS_URL=redis://this-host-is-intentionally-absent:6379/0 \
            aether-vault-engine:smoke >/dev/null
          ok=0
          for i in $(seq 1 60); do
            curl -sf http://localhost:8020/api/health >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [[ "$ok" == 1 ]] || { docker logs engine-drain >&2 || true; exit 1; }

          # 20 concurrent object uploads, fired in the background; SIGTERM lands on the
          # container while at least some of these are genuinely still in flight. Each
          # writes its own curl exit code + HTTP status so none can be silently dropped.
          RESULTS=$(mktemp -d)
          for i in $(seq 1 20); do
            (
              body=$(mktemp); head -c $((256 * 1024)) /dev/urandom > "$body"
              hash=$(sha256sum "$body" | cut -d' ' -f1)
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
                     -X POST --data-binary "@$body" "http://localhost:8020/api/objects/$hash")
              echo "$code" > "$RESULTS/$i"
              rm -f "$body"
            ) &
          done
          sleep 0.3   # let the batch actually start connecting before we pull the rug
          docker stop --time 20 engine-drain >/dev/null
          wait   # every backgrounded curl must finish (successfully or not) before we score it

          failed=0
          for i in $(seq 1 20); do
            code=$(cat "$RESULTS/$i" 2>/dev/null || echo "MISSING")
            if [[ "$code" != "201" && "$code" != "200" ]]; then
              echo "::error::upload $i did not complete cleanly during drain (got: $code)"
              failed=1
            fi
          done
          [[ "$failed" == 0 ]] || { docker logs engine-drain >&2 || true; exit 1; }
          echo "::notice::all 20 in-flight uploads completed cleanly across a real SIGTERM drain"
          docker rm -f engine-drain >/dev/null 2>&1 || true

      - name: Role=server + legacy auto-detect dispatch
        run: |
          docker stop engine-all >/dev/null
          # Explicit role:
          docker run -d --name engine-srv --network avnet -p 8010:8000 \
            -e AV_ENGINE_ROLE=server \
            -e DATABASE_URL=postgresql+asyncpg://av_user:av_password@pg:5432/aether_vault \
            aether-vault-engine:smoke >/dev/null
          # Legacy alias behavior: NO AV_ENGINE_ROLE, but DATABASE_URL set → server-only
          # (this is exactly what pre-1.2.2 pinned compose files produce).
          docker run -d --name engine-legacy --network avnet \
            -e DATABASE_URL=postgresql+asyncpg://av_user:av_password@pg:5432/aether_vault \
            aether-vault-engine:smoke >/dev/null
          ok=0
          for i in $(seq 1 60); do
            curl -sf http://localhost:8010/api/health >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [[ "$ok" == 1 ]] || { docker logs engine-srv >&2 || true; exit 1; }
          sleep 8
          # Checks for "next-server" (the webui's self-renamed process title), not
          # "node server.js" (the launch invocation Next.js overwrites once booted).
          if docker top engine-srv | grep -q "[n]ext-server"; then
            echo "::error::AV_ENGINE_ROLE=server started the webui too"; exit 1; fi
          if docker top engine-legacy | grep -q "[n]ext-server"; then
            echo "::error::legacy auto-detect started the webui too"; exit 1; fi
          # Legacy container's own registry must be healthy on its unmapped :8000:
          docker exec engine-legacy python -c \
            "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()" || {
            echo "::error::legacy auto-detect did not start the registry"; exit 1; }

      - name: Role=webui — standalone Next server only
        run: |
          docker run -d --name engine-webui -p 3001:3000 \
            -e AV_ENGINE_ROLE=webui -e NEXT_PUBLIC_API_URL=http://localhost:8000 \
            aether-vault-engine:smoke >/dev/null
          ok=0
          for i in $(seq 1 45); do
            curl -sf http://localhost:3001/ >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [[ "$ok" == 1 ]] || { docker logs engine-webui >&2 || true; exit 1; }
          if docker top engine-webui | grep -q "[u]vicorn"; then
            echo "::error::AV_ENGINE_ROLE=webui started the registry too"; exit 1; fi

      - name: Cleanup
        if: always()
        run: |
          docker rm -f engine-all engine-drain engine-srv engine-legacy engine-webui pg >/dev/null 2>&1 || true
          docker network rm avnet >/dev/null 2>&1 || true

  # e2e-engine-smoke above proves role dispatch from the "all" target with
  # AV_ENGINE_ROLE overridden -- this builds and boots the actual slim
  # `server`/`webui` Dockerfile targets released alongside every tag.
  slim-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build slim server + webui images
        run: |
          docker build --target server -t aether-vault-engine:server-smoke .
          docker build --target webui -t aether-vault-engine:webui-smoke .

      - name: Role=server (slim image) — registry healthy, no Node runtime at all
        run: |
          docker network create avnet-slim >/dev/null
          docker run -d --name pg-slim --network avnet-slim -e POSTGRES_USER=av_user \
            -e POSTGRES_PASSWORD=av_password -e POSTGRES_DB=aether_vault \
            postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b >/dev/null
          for i in $(seq 1 30); do
            docker exec pg-slim pg_isready -U av_user >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name slim-server --network avnet-slim -p 8010:8000 \
            -e DATABASE_URL=postgresql+asyncpg://av_user:av_password@pg-slim:5432/aether_vault \
            -e REDIS_URL=redis://this-host-is-intentionally-absent:6379/0 \
            aether-vault-engine:server-smoke >/dev/null
          ok=0
          for i in $(seq 1 45); do
            curl -sf http://localhost:8010/api/health >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [[ "$ok" == 1 ]] || { docker logs slim-server >&2 || true; exit 1; }
          # No Node binary should exist in this image at all -- stronger than "port 3000
          # doesn't respond", which a slow boot could produce transiently anyway.
          docker exec slim-server sh -c 'command -v node' && {
            echo "::error::slim server image has a node binary -- target: server should never install Node"; exit 1; } || true
          echo "::notice::role=server (slim image): registry healthy, confirmed no Node runtime present"

      - name: Role=webui (slim image) — dashboard healthy, no Python runtime at all
        run: |
          docker run -d --name slim-webui -p 3010:3000 \
            -e NEXT_PUBLIC_API_URL=http://localhost:8010 \
            aether-vault-engine:webui-smoke >/dev/null
          ok=0
          for i in $(seq 1 45); do
            curl -sf http://localhost:3010/ >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [[ "$ok" == 1 ]] || { docker logs slim-webui >&2 || true; exit 1; }
          docker exec slim-webui sh -c 'command -v python3 || command -v python' && {
            echo "::error::slim webui image has a python binary -- target: webui should never install Python"; exit 1; } || true
          echo "::notice::role=webui (slim image): dashboard healthy, confirmed no Python runtime present"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f slim-server slim-webui pg-slim >/dev/null 2>&1 || true
          docker network rm avnet-slim >/dev/null 2>&1 || true

  # A "preview environment" for a PR: boot the real release compose topology from a
  # locally built image (never pushed, works for fork PRs with no registry access) and
  # run the same release smoke checks, rendered into the PR run's own summary.
  preview-env:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Aether-Vault (for the av CLI used by release_smoke.sh)
        run: pip install -e .

      - name: Build the engine image locally (no push)
        run: docker build --target engine -t aether-vault-engine:preview .

      - name: Release smoke against the local preview image
        # Informational, not gating -- continue-on-error so the summary below still
        # renders a genuine failure instead of disappearing behind a red X.
        continue-on-error: true
        run: bash scripts/release_smoke.sh aether-vault-engine:preview 2>&1 | tee preview-smoke.log

      - name: Render preview summary
        if: always()
        run: |
          {
            echo "### Preview environment (PR #${{ github.event.number }})"
            echo ""
            echo "Built \`aether-vault-engine\` from this PR's own \`Dockerfile\` (target: engine, local only — never pushed) and ran \`scripts/release_smoke.sh\` against it."
            echo ""
            echo '```'
            tail -60 preview-smoke.log 2>/dev/null || echo "(no smoke log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # First time release artifacts are ever INSTALLED rather than just built: a wheel goes
  # into a clean Linux venv, and the sdist is compiled from scratch inside a clean Windows
  # venv (validating the MSVC/CMake path end users hit when no wheel matches).
  package-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke-wheel-linux:
    needs: package-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the built wheel into a clean venv
        run: |
          python -m venv "$GITHUB_WORKSPACE/clean"
          "$GITHUB_WORKSPACE/clean/bin/python" -m pip install ./dist/*.whl

      - name: Offline sanity roundtrip through the installed console script
        run: |
          AV="$GITHUB_WORKSPACE/clean/bin/av"
          PYBIN="$GITHUB_WORKSPACE/clean/bin/python"
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          "$AV" --version
          "$PYBIN" -c "import av_cli, av_server"
          # Packaging gates: the context-diff and registry surfaces must ship in the wheel.
          "$AV" diff --help > /dev/null
          "$AV" registry --help > /dev/null
          "$AV" init --mode local --yes --no-repl
          echo "packaged" > f.txt
          "$AV" add f.txt
          "$AV" commit -m "wheel-smoke"
          "$AV" log | grep "wheel-smoke"
          # Proves the contract schemas actually landed in the wheel installed into a
          # clean venv, not just in the checkout.
          "$PYBIN" -c "
          import importlib.resources as r
          names = {'envelope-1.0','event-1.0','run-1.0','webhook-payload-1.0','semdiff-1.0','avh-2.0',
                   'improver-1.0','change-set-1.0','policy-pack-1.0','eval-suite-1.0',
                   'tool-manifest-1.0','action-log-1.0','backup-manifest-1.0'}
          for name in names:
              ref = r.files('av_cli').joinpath('schemas', f'{name}.schema.json')
              assert ref.is_file(), f'{name}.schema.json missing from installed wheel'
          print('all contract schemas present in wheel')
          "

  smoke-sdist-windows:
    needs: package-build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile-install the sdist into a clean venv (MSVC + CMake path)
        shell: pwsh
        run: |
          python -m venv "$env:GITHUB_WORKSPACE\clean"
          $sdist = (Get-Item ./dist/*.tar.gz).FullName
          & "$env:GITHUB_WORKSPACE\clean\Scripts\python.exe" -m pip install $sdist

      - name: Offline sanity roundtrip through the installed console script
        shell: pwsh
        run: |
          $av = "$env:GITHUB_WORKSPACE\clean\Scripts\av.exe"
          $py = "$env:GITHUB_WORKSPACE\clean\Scripts\python.exe"
          $scratch = Join-Path $env:RUNNER_TEMP "av-sdist-smoke"
          New-Item -ItemType Directory -Force $scratch | Out-Null
          Set-Location $scratch
          & $av --version
          & $py -c "import av_cli, av_server"
          # Packaging gates: context-diff + registry surfaces present in the sdist.
          & $av diff --help *> $null
          & $av registry --help *> $null
          & $av init --mode local --yes --no-repl
          Set-Content -Path f.txt -Value packaged
          & $av add f.txt
          & $av commit -m sdist-smoke
          (& $av log) | Select-String sdist-smoke

  webui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_USER: av_user
          POSTGRES_PASSWORD: av_password
          POSTGRES_DB: aether_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis/redis-stack-server:latest@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install Aether-Vault (for the av CLI used by webui/e2e/seed_data.py)
        run: pip install -e .

      - name: Start aether-vault-server
        env:
          DATABASE_URL: postgresql+asyncpg://av_user:av_password@localhost:5432/aether_vault
          REDIS_URL: redis://localhost:6379/0
          # Bare-metal uvicorn has no Docker volume at /data — without a writable CAS
          # dir, object uploads 500 and the dashboard renders empty.
          AV_DATA_DIR: ${{ runner.temp }}/av-data
        run: |
          nohup python -m uvicorn av_server.server:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
          # Fail this step loudly instead of letting seed/E2E fail with misleading symptoms.
          curl -sf http://localhost:8000/api/health > /dev/null || {
            echo "::error::aether-vault-server did not become healthy in 30s"
            exit 1
          }
          # The health endpoint is DB-free; also assert the schema actually came up.
          psql "postgresql://av_user:av_password@localhost:5432/aether_vault" \
            -c "SELECT 1 FROM alembic_version" > /dev/null || {
            echo "::error::server up but migration chain did not commit (schema missing)"
            exit 1
          }

      - name: Seed checkpoint data via the real av CLI
        run: python webui/e2e/seed_data.py

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: webui
        run: npx playwright install --with-deps chromium

      # Built fresh in this job (not the docker-compose webui image) so the E2E run
      # always exercises the current checkout's source, not a stale cached Docker layer.
      - name: Build and start the webui
        working-directory: webui
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm run build
          nohup npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && break
            sleep 1
          done

      - name: Run Playwright E2E tests (anonymous-mode specs)
        working-directory: webui
        run: npx playwright test dashboard.spec.ts weight-diff.spec.ts runs.spec.ts

      # Browser-level Protected-mode coverage: restart the same server in Protected mode
      # (same DB/data, seeded content stays visible), then drive the ?av_token= handoff.
      - name: Restart server in Protected mode
        run: |
          pkill -f "uvicorn av_server.server:app" || true
          sleep 2
          cd "$GITHUB_WORKSPACE"
          DATABASE_URL=postgresql+asyncpg://av_user:av_password@localhost:5432/aether_vault \
          REDIS_URL=redis://localhost:6379/0 \
          AV_DATA_DIR=${{ runner.temp }}/av-data \
          AV_API_TOKEN=owner-browser-secret AV_AUTH_USERS='{"alice":"alice-browser-token"}' \
            nohup python -m uvicorn av_server.server:app --host 0.0.0.0 --port 8000 \
            > /tmp/prot-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
          [[ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/refs)" == "401" ]] || {
            echo "::error::server did not come up in Protected mode"; exit 1; }

      - name: Run browser-level token-gate E2E
        working-directory: webui
        run: npx playwright test token-gate.spec.ts

      # Ground truth for any token-gate failure: the protected server's OWN access log
      # (orphaned-process stdout otherwise vanishes between step log sections).
      - name: Dump protected-server access log
        if: always()
        run: tail -n 60 /tmp/prot-server.log 2>/dev/null || echo "(no log)"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: webui/playwright-report/
          retention-days: 7

  # Schema-verifies the Helm chart on every PR -- not a real cluster deployment, a
  # deliberate scope decision (see the chart's own README). Fast, so it runs on every
  # push, unlike ha-drill below.
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "v3.15.0"

      - name: Install kubeconform
        # Checksum-verified rather than piping a network download straight into
        # /usr/local/bin, pinned from kubeconform v0.8.0's own published CHECKSUMS file.
        run: |
          curl -sLO https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f kubeconform-linux-amd64.tar.gz kubeconform
          rm kubeconform-linux-amd64.tar.gz

      - name: helm lint (default + a representative override set)
        run: |
          helm lint deploy/helm/aether-vault \
            --set database.url=postgresql+asyncpg://u:p@h:5432/d --set redis.url=redis://h:6379/0
          helm lint deploy/helm/aether-vault \
            --set database.existingSecret=x --set redis.existingSecret=y \
            --set ingress.enabled=true --set autoscaling.enabled=true --set replicaCount=3

      - name: helm template | kubeconform -strict (default values)
        run: |
          helm template av deploy/helm/aether-vault | kubeconform -strict -summary

      - name: helm template | kubeconform -strict (ingress + autoscaling + 3 replicas)
        run: |
          helm template av deploy/helm/aether-vault \
            --set database.url=postgresql+asyncpg://u:p@h:5432/d --set redis.url=redis://h:6379/0 \
            --set ingress.enabled=true --set autoscaling.enabled=true --set replicaCount=3 \
            | kubeconform -strict -summary

      - name: helm template | kubeconform -strict (existingSecret + tenancy + redis backends)
        run: |
          helm template av deploy/helm/aether-vault \
            --set database.existingSecret=my-secret \
            --set tenancy.enforce=true --set rateLimit.backend=redis --set authSpike.backend=redis \
            | kubeconform -strict -summary

  # The real HA proof — brings up docker-compose.ha.yml (nginx LB + 2 engine replicas +
  # Postgres/Redis primary/replica), kills one engine replica mid-load, and asserts zero
  # failed pushes, zero double webhook delivery, and a globally enforced rate limit.
  # Separate from chaos-drills above, which chaos-tests a single instance.
  ha-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run the HA drill
        # KEEP_HA_STACK=1 so this job's own final "Tear down" step (if: always()) does
        # the cleanup, not ha_drill.sh's own EXIT trap, which would otherwise tear the
        # stack down before "Dump engine logs on failure" below ever runs.
        # A dedicated step timeout, well under the job's own 30 minutes, lets a genuine
        # hang cancel (and dump diagnostics) with budget left, instead of silently
        # burning the whole job timeout on one stuck step.
        timeout-minutes: 15
        run: KEEP_HA_STACK=1 bash scripts/ha_drill.sh

      - name: Dump engine logs on failure
        # `cancelled()` too: GitHub Actions marks a timeout-killed step `cancelled`, not
        # `failed`, so `if: failure()` alone would skip this on exactly the timeout case
        # that matters most. Not `always()`, so this stays silent on a genuine pass.
        if: failure() || cancelled()
        run: |
          docker compose -f docker-compose.ha.yml -p aether-vault-ha logs --tail=500 || true
          echo "--- container states ---"
          docker compose -f docker-compose.ha.yml -p aether-vault-ha ps -a || true

      - name: Tear down (in case the drill's own trap didn't run)
        if: always()
        run: docker compose -f docker-compose.ha.yml -p aether-vault-ha down -v || true

  # CI observability — a per-job duration/budget table rendered into this run's own
  # summary (and, on a same-repo PR, posted as a comment). `needs:` every job so this
  # always runs last; `if: always()` so a red run still gets a summary. Never gating.
  ci-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - test
      - test-linux
      - flaky-quarantine
      - contract-matrix
      - migrations-drill
      - lint-workflows
      - plugin-tests
      - webui-tests
      - server-tests
      - server-tests-windows
      - e2e-suite
      - chaos-drills
      - e2e-engine-smoke
      - slim-image-smoke
      - preview-env
      - package-build
      - smoke-wheel-linux
      - smoke-sdist-windows
      - webui-e2e
      - helm-lint
      - ha-drill
    permissions:
      contents: read
      actions: read          # to read this run's own job list
      pull-requests: write    # to post/update the summary comment on same-repo PRs only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Render the CI summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ci_summary.py --workflow tests.yml --run-id "${{ github.run_id }}" \
            | tee ci-summary.md
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Same-repo PRs only — a fork PR's GITHUB_TOKEN has no write access to the base
      # repo's PR comments, and this repo permanently bans the trigger variant that
      # would grant it (see tests/test_ci_policy.py's standing guard).
      - name: Post/update the summary as a PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.number }}" --edit-last --create-if-none -F ci-summary.md
