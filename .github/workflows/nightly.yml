name: Nightly Compatibility

# The push matrix only covers the floor (3.10) + ceiling (3.14) — the in-between versions
# cost minutes every push without covering distinct failure modes most days. Nightly runs
# the FULL range so a regression in 3.11–3.13 surfaces within a day instead of at release.
# Also serves as the manual "run everything stack-free across versions" button
# (workflow_dispatch) before cutting a release.

on:
  schedule:
    - cron: "0 3 * * *"   # daily 03:00 UTC
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        run: pip install -e .[dev]

      - name: Run full suite
        env:
          AV_DATA_DIR: ${{ runner.temp }}/av-data
        run: pytest tests/ -q

  # v1.3.0: no leg anywhere in CI ever ran on macOS before this — the env-snapshot and
  # CDC-chunking golden-hash fixtures assert cross-machine determinism (todo.md items
  # 11/1) but had only ever proven it across Windows (push CI) and Linux (nightly's
  # `compat` job above), never a third OS. Scoped to just those tests (-k), not the
  # whole suite — this leg exists to prove ONE property, not to duplicate `compat`.
  golden-fixtures-macos:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Aether-Vault (builds the C++ core via pybind11)
        # `src/core.cpp` uses C++17 <filesystem> (fs::path/exists/file_size/
        # last_write_time) -- Apple's libc++ marks every one of those symbols
        # unavailable before macOS 10.15, but setuptools' default deployment target on
        # this runner's Python build is 10.14 (baked into the interpreter, not this
        # repo's own build config -- confirmed via `docker inspect`-style investigation:
        # no `-mmacosx-version-min`/`MACOSX_DEPLOYMENT_TARGET` is set anywhere in this
        # repo), so the compile fails with "'path' is unavailable: introduced in macOS
        # 10.15" before this env var is set. 10.15 is the minimum that actually compiles;
        # not raised further to stay maximally compatible.
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: pip install -e .[dev]

      - name: Cross-OS golden-hash fixtures (env snapshot + CDC chunking)
        env:
          AV_DATA_DIR: ${{ runner.temp }}/av-data
        run: pytest tests/test_env_snapshot.py tests/test_dataset_cdc.py tests/test_core.py -q -k "golden or cdc_boundary_stability or cdc_determinism"
