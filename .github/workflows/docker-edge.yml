name: Docker Edge Build

# Rolling ":edge" build tracking `master` — for visibility/testing between tagged releases.
# Never touches `:latest`, which stays exclusively tied to tagged releases (see release.yml).
# (Was `main` — this repo's default branch has always been `master`, so the trigger never
# fired; caught in the v1.1.8 doc/config sweep.)
#
# v1.2.2 engine consolidation: ONE image (aether-vault-engine) is built and pushed.
# The historical aether-vault-server/-webui alias tags were removed at v1.3.0 (the
# earliest-possible MINOR boundary VERSIONING.md named for this) — see
# docs/migrate-engine-image.md. Already-pulled legacy images still auto-detect their
# role from DATABASE_URL/NEXT_PUBLIC_API_URL (docker/engine-entrypoint.sh).

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'webui/**'
      - 'python/**'
      - 'src/**'
      - 'docker-compose*.yml'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/docker-edge.yml'

jobs:
  build-and-push-edge:
    name: Build and push :edge engine image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          # v1.3.0 (Probleme.md): explicit — see release.yml's identical comment.
          target: engine
          push: true
          tags: ghcr.io/leon1706-lol/aether-vault-engine:edge

      # v1.3.0 (todo.md item 19): slim, single-role images alongside :edge.
      - name: Build and push slim server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          tags: ghcr.io/leon1706-lol/aether-vault-engine:server-edge

      - name: Build and push slim webui image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: webui
          push: true
          tags: ghcr.io/leon1706-lol/aether-vault-engine:webui-edge
