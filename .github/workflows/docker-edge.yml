name: Docker Edge Build

# Rolling ":edge" build tracking `master` — for visibility/testing between tagged releases.
# Never touches `:latest`, which stays exclusively tied to tagged releases (see release.yml).
# (Was `main` — this repo's default branch has always been `master`, so the trigger never
# fired; caught in the v1.1.8 doc/config sweep.)
#
# v1.2.2 engine consolidation: ONE image (aether-vault-engine) is built and pushed;
# the historical aether-vault-server/-webui names ride along as ALIASES of the same
# image for one transition cycle so existing installs' pulls keep working
# (auto-detected role per legacy container — see docker/engine-entrypoint.sh).
# Aliases are removed in the next release.

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'webui/**'
      - 'python/**'
      - 'src/**'
      - 'docker-compose*.yml'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/docker-edge.yml'

jobs:
  build-and-push-edge:
    name: Build and push :edge engine image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build, one push step — every tag below receives THE SAME image.
      - name: Build and push engine image (+ legacy aliases)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/leon1706-lol/aether-vault-engine:edge
            ghcr.io/leon1706-lol/aether-vault-server:edge
            ghcr.io/leon1706-lol/aether-vault-webui:edge
