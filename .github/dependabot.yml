version: 2
updates:
  # Python dependencies (runtime + dev extras live in pyproject.toml)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly

  # Web UI frontend dependencies
  - package-ecosystem: npm
    directory: "/webui"
    schedule:
      interval: weekly

  # GitHub Actions pins — the project deliberately tracks Node-24 majors; keep them fresh
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
