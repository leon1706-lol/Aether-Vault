[build-system]
requires = ["setuptools>=68.0", "pybind11>=2.11.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-vault"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "pybind11>=2.11.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0"
]

[project.optional-dependencies]
lightning = ["lightning>=2.0.0"]
transformers = ["transformers>=4.30.0"]
mlflow = ["mlflow>=2.0.0"]

[project.scripts]
av = "av_cli.main:cli"
