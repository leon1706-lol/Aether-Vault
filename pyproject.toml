[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "pybind11>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-vault"
description = "High-performance, Git-like version control and registry for ML models, datasets, and code — in a single atomic commit."
readme = "README.md"
license = { text = "PolyForm Noncommercial License 1.0.0" }
authors = [{ name = "Leon Schwarzkopf (Aether Quant)" }]
keywords = ["machine-learning", "version-control", "mlops", "model-registry", "safetensors", "dataset-versioning", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Software Development :: Version Control",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "pybind11>=3.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13",
    "redis>=5.0.0",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "prompt_toolkit>=3.0.0",
    "packaging>=23.0"
]

[project.optional-dependencies]
lightning = ["lightning>=2.0.0"]
transformers = ["transformers>=4.30.0"]
mlflow = ["mlflow>=2.0.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "httpx>=0.24.0"]
benchmarks = ["dvc>=3.55,<4", "mlflow>=2.16"]

[project.scripts]
av = "av_cli.main:run"

[project.urls]
Homepage = "https://github.com/leon1706/aether-vault"
Repository = "https://github.com/leon1706/aether-vault"
Issues = "https://github.com/leon1706/aether-vault/issues"
Changelog = "https://github.com/leon1706/aether-vault/blob/main/development/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the repo as `python.av_cli.*` (namespace package from the checkout root).
# Without this, bare `pytest ...` (console-script invocation — exactly what CI uses) never
# puts the repo root on sys.path and every job dies at conftest with
# "ModuleNotFoundError: No module named 'python'". `python -m pytest` masked this locally
# because `-m` injects CWD into sys.path.
pythonpath = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
av_cli = ["docker/*.yml"]

[tool.setuptools_scm]
write_to = "python/av_cli/_version.py"
fallback_version = "0.0.0.dev0"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux* pp*"
