[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "pybind11>=2.11.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-vault"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "pybind11>=2.11.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "prompt_toolkit>=3.0.0",
    "packaging>=23.0"
]

[project.optional-dependencies]
lightning = ["lightning>=2.0.0"]
transformers = ["transformers>=4.30.0"]
mlflow = ["mlflow>=2.0.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "httpx>=0.24.0"]
benchmarks = ["dvc>=3.55,<4", "mlflow>=2.16"]

[project.scripts]
av = "av_cli.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
av_cli = ["docker/*.yml"]

[tool.setuptools_scm]
write_to = "python/av_cli/_version.py"
fallback_version = "0.0.0.dev0"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux* pp*"
